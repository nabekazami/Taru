        }

        /* ===== フォルダの移動 ===== */
        function leaveFolder() {
            exitSelect();
            query = '';
            $('q').value = '';
            $('searchRow').hidden = true;
        }
        function go(stId, p) {
            const t = tab();
            t.st = stId;
            t.p = [...p];
            t.sc = 0;
            leaveFolder();
            save();
            renderAll();
        }

        /* ===== メイン表示領域 ===== */
        let items = [], shown = [], mainTok = 0, loading = false, query = '';
        const sel = new Set();
        let selMode = false;
        async function renderMain() {
            if (isHome()) {
                ++mainTok;
                items = [];
                shown = [];
                drawHome();
                return;
            }
            const tok = ++mainTok, t = tab(), st = stOf(t.st), main = $('main');
            loading = true;
            const lt = setTimeout(() => {
                if (tok == mainTok)
                    main.innerHTML = '<div class="msg">読み込み中…</div>';
            }, 120);
            try {
                const r = await listDir(st, t.p);
                if (tok != mainTok)
                    return;
                items = r;
                clearTimeout(lt);
                draw();
                syncEmpty();
                main.scrollTop = t.sc || 0;
            }
            catch (e) {
                clearTimeout(lt);
                if (tok != mainTok)
                    return;
                items = [];
                shown = [];
                showErr(e, st);
            }
            requestAnimationFrame(() => loading = false);
        }
        function showErr(e, st) {
            const code = e && e.code;
            let h;
            if (code == 'pcnone')
                h = 'PCのテスト用フォルダがまだ選ばれていません。<br>中身を消しても困らない、<b>テスト用のフォルダ</b>を選んでください。<br><button class="btn" data-act="pick">フォルダを選ぶ</button>';
            else if (code == 'pcperm')
                h = `前回のフォルダ「${esc(pcRoot.name)}」に接続します。<br><button class="btn" data-act="perm">接続する</button><br><button class="btn" data-act="pick" style="background:var(--panel2);color:var(--tx)">別のフォルダを選ぶ</button>`;
            else if (code == 'perm')
                h = `ファイルを表示するには、「すべてのファイルへのアクセス」の許可が必要です。<br>ボタンを押すと設定の画面が開くので、「たるファイラー」をオンにして戻ってきてください。<br><button class="btn" data-act="appperm">許可する</button>`;
            else if (code == 'restricted')
                h = `このフォルダは、Androidの決まりで中を見ることができません。<br><button class="btn" data-act="up">1つ上のフォルダへ</button>`;
            else if (code == 'nosd')
                h = `${esc(st.name)}が見つかりません。<br>入れてから、もう一度開いてください。`;
            else if (code == 'denied')
                h = 'このフォルダは読めませんでした。';
            else if (code == 'notfound')
                h = `このフォルダは見つかりません。<br><button class="btn" data-act="root">${ico(st)} ${esc(rootLabel(st))}の一番上へ</button>`;
            else
                h = '読み込めませんでした。';
            $('main').innerHTML = `<div class="msg">${h}</div>`;
        }
        /* ===== ホーム(タブを全部閉じたとき) ===== */
        function drawHome(keepScroll) {
            const sc = $('main').scrollTop;
            const card = st => {
                const sub = st.kind == 'gdrive' ? `<div class="sub">${esc(acName(st))}</div>` : '';
                /* 使用量の棒グラフがないタイルも、見えない棒グラフを入れて内部ストレージと同じ高さにそろえます */
                const ghost = st.cap ? '' : '<div class="bar" style="visibility:hidden"></div>';
                return `<button class="hcard" data-hst="${st.id}"><span class="ic">${ico(st)}</span><div class="tx"><div class="nm">${esc(st.name)}</div>${sub}${capHtml(st)}${ghost}</div></button>`;
            };
            /* Googleドライブは背の高いタイルなので、1つ目のGoogleドライブの前で改行して別の並びにします(ほかのタイルが引き伸ばされないように) */
            const grp = list => list.length ? `<div class="hcards">${list.map(card).join('')}</div>` : '';
            const cards = grp(STORAGES.filter(st => !st.hidden && st.kind != 'gdrive')) + grp(STORAGES.filter(st => st.kind == 'gdrive'));
            const favs = S.favs.length ? '<div class="hfavs">' + S.favs.map(f => {

                const label = st.kind == 'gdrive' ? `<span class="two"><span class="nm">${esc(f.name)}</span><span class="ac">${esc(acName(st))}</span></span>` : `<span class="nm">${esc(f.name)}</span>`;

            }).join('') + '</div>'
                : `<div class="hnote">パス表示の ${sv('star')} をタップすると、今いる場所をお気に入りに登録できます。</div>`;
            const hf = S.homeFold || (S.homeFold = {});
            const sec = (k, title, body) => `<button class="hsech" data-hsec="${k}"><span class="ar">${sv(hf[k] ? 'right' : 'down')}</span>${title}</button>` + (hf[k] ? '' : body);
            const permNote = APP && !APP.hasPerm() ? `<div class="hperm"><div>ファイルを表示するには、「すべてのファイルへのアクセス」の許可が必要です。</div><button class="btn" data-act="appperm">許可する</button></div>` : '';
            $('main').innerHTML = `<div class="home">` + permNote + sec('storage', 'ストレージ', `<div class="hgrp">${cards}</div>`)
                + sec('fav', 'お気に入り', favs)
                + `<div class="hsech" style="cursor:default"><span class="ar"></span>ゴミ箱</div><div class="hcards"><button class="hcard" data-htrash="1"><span class="ic">${sv('del')}</span><div class="tx"><div class="nm">ゴミ箱</div><div class="sub">0件・0 B</div></div></button></div></div>`;
            $('main').scrollTop = keepScroll ? sc : 0;
            fillHomeTrash();
        }
        function visible() {
            const nm = x => x.label || x.name; /* ゴミ箱では、表示する名前(元の名前)は label */
            let a = items.filter(x => S.hidden || !nm(x).startsWith('.'));
            if (query) {
                const q = query.toLowerCase();
                a = a.filter(x => nm(x).toLowerCase().includes(q));
            }
            const { k, asc } = curSort(), m = asc ? 1 : -1;
            const by = (x, y) => k == 'date' ? (x.mtime || 0) - (y.mtime || 0)
                : k == 'size' ? (x.size || 0) - (y.size || 0)
                    : k == 'type' ? COL.compare(ext(nm(x)), ext(nm(y)))
                        : 0;
            return a.sort((x, y) => (y.dir - x.dir) || m * (by(x, y) || COL.compare(nm(x), nm(y))));
        }
        function meta(x) {
            if (x.tr) /* ゴミ箱: 元の場所・削除日・自動で消えるまでの日数 */
                return `${esc(fromText(stOf(x.tr.st), x.tr.e))}・${fmtDate(x.tr.e.deleted).slice(0, 10)} 削除・あと${daysLeft(x.tr.e)}日`;
            if (x.dir)
                return x.mtime ? fmtDate(x.mtime) : 'フォルダ';
            return [fmtDate(x.mtime), fmtSize(x.size)].filter(Boolean).join('・');
        }
        function draw() {
            const main = $('main');
            fsHide(); /* フォルダを開き直したら、スクロールのつまみはいったん隠す */
            shown = visible();
            if (!shown.length) {
                main.innerHTML = `<div class="msg">${query ? '一致するものはありません' : isTrash() ? 'ゴミ箱は空です' : 'このフォルダは空です'}</div>`;
                return;
            }
            const t = tab(), here = clip && clip.st == t.st && samePath(clip.p, t.p), dst = stOf(t.st);
            const view = viewOf(), gal = view == 'gal';
            main.innerHTML = `<div class="${view}${gal ? ' gc' + (S.gcols || '4') : ''}${selMode ? ' selmode' : ''}">` + shown.map(x => {
                const s = sel.has(x.name), cm = here && clip.names.includes(x.name);
                const mark = cm ? `<span class="cbm">${sv(clip.op == 'copy' ? 'copy' : 'move')}</span>` : '';
                const lb = x.label || x.name;
                const th = thumbTag(x, dst, t.p, gal);
                return `<div class="it${lb.startsWith('.') ? ' hid' : ''}${s ? ' sel' : ''}${cm ? ' clip' + (clip.op == 'move' ? ' cmove' : '') : ''}${th ? ' media' : ''}" data-n="${esc(x.name)}">`
                    + `<span class="ck">${s ? sv('check') : ''}</span><span class="ic">${x.dir ? sv('folder') : ftype(lb)[0]}${th}${mark}</span>`
                    + `<div class="tx"><div class="nm">${esc(lb)}</div><div class="mt">${meta(x)}</div></div></div>`;
            }).join('') + '</div>';
            thumbsStart();
        }

        /* ===== サムネイル(画像・動画・APK) =====
           種類の絵の上に <img class="th"> を重ねておき、読み込めたら .ic に thok を付けて入れ替えます。
           読み込むのは、画面に見えている分(とその少し先)だけ。
           アプリ版: Kotlin(Thumbs.kt)が https://appassets.androidplatform.net/thumb?p=... で小さい画像を返します。
           HTML版: PCフォルダの画像だけ(ファイルをそのまま読みます)。ダミーのストレージは種類の絵のまま */
        const TH_IMG = /^(jpe?g|png|gif|webp|bmp|heic|heif|avif)$/, TH_VID = /^(mp4|mov|mkv|webm|3gp|avi|m4v)$/;
        const PLAY = `<span class="pl"><svg viewBox="0 0 24 24"><path d="M8.5 5.5v13l10.5-6.5z" fill="#fff"/></svg></span>`; /* 三角の重心が真ん中に来る形 */
        function thumbTag(x, st, p, big) {
            if (x.dir || x.tr || S.thumbs === false || !st)
                return '';
            const e = ext(x.name);
            const k = TH_IMG.test(e) ? 'img' : TH_VID.test(e) ? 'vid' : e == 'apk' ? 'apk' : '';
            if (!k)
                return '';
            if (APP && st.kind == 'local' && !st.missing) {
                const url = 'https://appassets.androidplatform.net/thumb?s=' + (big ? 512 : 256) + '&m=' + (x.mtime || 0) + '&p=' + encodeURIComponent([st.real, ...p, x.name].join('/'));
                return `<span class="thw"><img class="th ${k}" alt="" data-src="${esc(url)}">${k == 'vid' ? PLAY : ''}</span>`;
            }
            if (st.kind == 'pc' && k == 'img' && !/^hei[cf]$/.test(e) && (x.size || 0) < 40e6)
                return `<span class="thw"><img class="th img" alt="" data-pc="${esc(x.name)}"></span>`;
            return '';
        }
        let thObs = null, thUrls = [];
        function thumbsStart() {
            if (thObs)
                thObs.disconnect();
            thObs = null;
            thUrls.forEach(u => URL.revokeObjectURL(u));
            thUrls = [];
            const imgs = $('main').querySelectorAll('img.th');
            if (!imgs.length)
                return;
            const p = tab().p.slice();
            /* 見張るのは枠(.ic)。読み込む前の画像は大きさが0なので */
            const obs = thObs = new IntersectionObserver(es => {
                for (const e of es)
                    if (e.isIntersecting) {
                        obs.unobserve(e.target);
                        const img = e.target.querySelector('img.th');
                        if (img)
                            thLoad(img, p);
                    }
            }, { rootMargin: '300px 0px' });
            imgs.forEach(i => obs.observe(i.closest('.ic')));
        }
        async function thLoad(img, p) {
            if (img.dataset.src) {
                img.src = img.dataset.src;
                return;
            }
            try {
                const f = await (await (await pcDir(p)).getFileHandle(img.dataset.pc)).getFile();
                if (!img.isConnected)
                    return;
                const u = URL.createObjectURL(f);
                thUrls.push(u);
                img.src = u;
            }
            catch { }
        }
        async function openFile(x) {
            if (notYet('①-3'))
                return;
            const t = tab(), st = stOf(t.st);
            if (st.kind != 'pc') {
                toast('ファイルを開くのは、' + APPONLY);
                return;
            }
            try {
                const f = await (await (await pcDir(t.p)).getFileHandle(x.name)).getFile();
                const url = URL.createObjectURL(f);
                window.open(url, '_blank');
                setTimeout(() => URL.revokeObjectURL(url), 60000);
            }
            catch {
                toast('ファイルを開けませんでした');
            }
        }

        /* ===== 選択モード ===== */
        function updateSel() {
            if (!sel.size)
                selMode = false;
            $('top').hidden = selMode;
            $('selTop').hidden = !selMode;
            $('opbar').hidden = !(selMode || isTrash()); /* ゴミ箱のタブでは、選んでいなくても出します */
            updateClip();
            $('selCount').textContent = `${sel.size}件選択中`;
            $('selAll').textContent = shown.length && sel.size == shown.length ? '全解除' : '全選択';
            $('opRen').disabled = sel.size != 1;
            /* ふつう: コピー/移動/削除/名前変更/その他/キャンセル
               ゴミ箱(選択中): 元に戻す/完全に削除/キャンセル  ゴミ箱(選択なし): ゴミ箱を空にする */
            const tr = isTrash();
            const ops = !tr ? ['copy', 'move', 'del', 'ren', 'more', 'cancel'] : selMode ? ['restore', 'purge', 'cancel'] : ['empty'];
            for (const b of $('opbar').querySelectorAll('[data-op]'))
                b.hidden = !ops.includes(b.dataset.op);
            syncEmpty();
            const g = $('main').firstElementChild;
            if (g)
                g.classList.toggle('selmode', selMode);
            for (const el of $('main').querySelectorAll('.it')) {
                const s = sel.has(el.dataset.n);
                el.classList.toggle('sel', s);
                el.querySelector('.ck').innerHTML = s ? sv('check') : '';
            }
            drTop();
        }
        /* 「ゴミ箱を空にする」は、ゴミ箱が空のときは押せません */
        function syncEmpty() {
            const b = $('opbar').querySelector('[data-op=empty]');
            if (b)
                b.disabled = !items.length;
        }
        function toggleSel(name) {
            if (sel.has(name))
                sel.delete(name);
            else
                sel.add(name);
            selMode = sel.size > 0;
            updateSel();
        }
        function exitSelect() {
            sel.clear();
            selMode = false;
            updateSel();
        }
        function selectAll() {
            if (!shown.length)
                return;
            if (selMode && sel.size == shown.length) {
                exitSelect();
                return;
            }
            shown.forEach(x => sel.add(x.name));
            selMode = true;
            updateSel();
        }
        const selItems = () => shown.filter(x => sel.has(x.name));

        /* ===== コピー・移動(貼り付けバー) ===== */
        let clip = null; /* { op: 'copy' | 'move', st, p, names } */
        function setClip(op) {
            const list = selItems();
            if (!list.length)
                return;
            if (op == 'move' && blockProtected(list, '移動'))
                return;
            const t = tab();
            clip = { op, st: t.st, p: [...t.p], names: list.map(x => x.name) };
            exitSelect();
            draw(); /* 選んでいたファイルに印を付けます */
            toast(`貼り付ける場所を開いて、「${op == 'copy' ? 'ここにコピー' : 'ここに移動'}」を押してください`);
        }
        function updateClip() {
            const show = !!clip && !selMode && !isHome() && !isTrash();
            $('clipBar').hidden = !show;
            if (clip)
                $('cbPaste').textContent = clip.op == 'copy' ? 'ここにコピー' : 'ここに移動';
            if (clip)
                $('cbText').innerHTML = `${sv(clip.op == 'copy' ? 'copy' : 'move')}${clip.names.length == 1 ? `「${esc(clip.names[0])}」` : clip.names.length + '件'}を${clip.op == 'copy' ? 'コピー' : '移動'}`;
        }

        /* 進み具合(0.3秒以上かかるときだけ表示します) */
        let job = null, jobSeq = 0;
        function jobStart(title) {
            /* bTotal / bDone / bCur: 量の進み具合(全体 / 終わった分 / コピー中のファイルの分) */
            job = { id: ++jobSeq, cancel: false, n: 0, cur: '', title, policy: null, bTotal: 0, bDone: 0, bCur: 0 };
            const j = job;
            j.t = setTimeout(() => {
                if (job === j) {
                    $('toast').classList.remove('show'); /* 前のお知らせが進み具合に重ならないように */
                    $('prog').hidden = false;
                }
            }, 300);
            progDraw();
            return j;
        }
        function progDraw() {
            if (!job)
                return;
            $('progT').textContent = `${job.title}…`;
            $('progN').textContent = job.cur;
            /* 件数は、選んだもの(フォルダは中身ごとで1件)の数で数えます */
            $('progC').textContent = job.total ? `${job.done} / ${job.total}件` : '';
            /* 割合: 量が分かるとき(コピー・移動)は量で、分からないときは件数で */
            let k = null;
            if (job.bTotal) {
                const now = Math.min(job.bTotal, job.bDone + job.bCur);
                $('progS').textContent = `${fmtSize(now)} / ${fmtSize(job.bTotal)}`;
                k = now / job.bTotal;
            }
            else {
                $('progS').textContent = '';
                if (job.total)
                    k = job.done / job.total;
            }
            $('progBar').classList.toggle('unk', k == null);
            $('progI').style.width = k == null ? '' : (k * 100).toFixed(1) + '%';
            $('progP').textContent = k == null ? '' : Math.floor(k * 100) + '%';
        }
        /* コピー中のファイルの進み具合(Kotlin が約0.2秒ごとに呼びます) */
        window.__taruProg = (id, bytes) => {
            if (job && job.id == id) {
                job.bCur = bytes;
                progDraw();
            }
        };
        function jobEnd() {
            if (job) {
                clearTimeout(job.t);
                if (APP && APP.endJob)
                    APP.endJob(job.id);
            }
            job = null;
            $('prog').hidden = true;
        }

        /* 同じ名前があったとき: 上書き(最初に選択) / スキップ / 両方残す */
        function askConflict(j, name, bothDir) {
            if (j.policy)
                return Promise.resolve(j.policy);
            return new Promise(res => {
                const m = $('modal');
                const over = bothDir ? '統合する<small>フォルダの中身を合わせます(同じ名前のファイルは、またここで確認します)</small>' : '上書きする<small>今あるほうを置き換えます</small>';
                m.innerHTML = `<div class="dlg" role="dialog"><h3>同じ名前があります</h3><div class="bd">「${esc(name)}」は、貼り付け先にすでにあります。</div>`
                    + `<div class="cf"><label><input type="radio" name="cf" value="over" checked><span>${over}</span></label>`
                    + `<label><input type="radio" name="cf" value="skip"><span>スキップ<small>このファイルは貼り付けません</small></span></label>`
                    + `<label><input type="radio" name="cf" value="both"><span>両方残す<small>名前の後ろに (2) などを付けます</small></span></label></div>`
                    + `<label class="cfall"><input type="checkbox" id="cfAll">以降も同じにする</label>`
                    + `<div class="bt"><button data-r="0">中止</button><button data-r="1" class="ok">OK</button></div></div>`;
                m.hidden = false;
                const done = r => {
                    const v = r ? m.querySelector('input[name=cf]:checked').value : 'cancel';
                    if (r && $('cfAll').checked)
                        j.policy = v;
                    m.hidden = true;
                    m.innerHTML = '';
                    closeModal = null;
                    res(v);
                };
                closeModal = () => done(0);
                m.onclick = e => {
                    const b = e.target.closest('[data-r]');
                    if (b)
                        done(+b.dataset.r);
                };
            });
        }

        /* 1つ(フォルダなら中身ごと)を貼り付けます。merge: 貼り付け先に同じ名前のフォルダがあり、中身を合わせるとき */
        async function putEntry(j, src, sp, name, dst, dp, dn, move, merge) {
            if (j.cancel)
                return;
            const info = await fsGet(src, sp, name);
            if (!info)
                return;
            j.cur = name;
            progDraw();
            if (move && !merge && src === dst && await fsMoveFast(src, sp, name, dp, dn)) {
                j.n++;
                progDraw();
                return;
            }
            if (info.dir) {
                if (!merge)
                    await fsMkdir(dst, dp, dn);
                for (const ch of await fsList(src, [...sp, name])) {
                    if (j.cancel)
                        return;
                    let cn = ch.name, m = false;
                    const ex = await fsGet(dst, [...dp, dn], cn);
                    if (ex) {
                        const a = await askConflict(j, cn, ex.dir && ch.dir);
                        if (a == 'cancel') {
                            j.cancel = true;
                            return;
                        }
                        if (a == 'skip')
                            continue;
                        if (a == 'both')
                            cn = await uniqName(dst, [...dp, dn], cn, ch.dir);
                        else if (ex.dir && ch.dir)
                            m = true;
                        else
                            await fsRemove(dst, [...dp, dn], cn);
                    }
                    await putEntry(j, src, [...sp, name], ch.name, dst, [...dp, dn], cn, move, m);
                }
                /* フォルダの更新日時もコピー元にそろえます(アプリ版) */
                if (!j.cancel && isReal(src) && isReal(dst))
                    await appCall('copyTime', { src: ap(src, sp, name), dst: ap(dst, dp, dn) }).catch(() => 0);
                /* 移動のときは、中身が全部移ったフォルダだけ消します(スキップしたものがあれば残します) */
                if (move && !j.cancel && !(await fsList(src, [...sp, name])).length)
                    await fsRemove(src, sp, name);
            }
            else {
                await fsCopyFile(src, sp, name, dst, dp, dn, j);
                if (j.cancel)
                    return;
                if (move)
                    await fsRemove(src, sp, name);
                j.n++;
                progDraw();
            }
        }

        /* フォルダを移動・名前変更したとき、タブとお気に入りの場所も一緒に書き換えます */
        function rewritePaths(fromSt, from, toSt, to) {
            const under = (st, p) => st == fromSt && p.length >= from.length && from.every((x, i) => p[i] === x);
            for (const o of [...S.tabs, ...S.favs])
                if (under(o.st, o.p)) {
                    o.p = [...to, ...o.p.slice(from.length)];
                    o.st = toSt;
                }
            /* フォルダごとの並べ替えも、一緒に引っ越します */
            for (const key of Object.keys(S.sorts)) {
                const i = key.indexOf(':'), st = key.slice(0, i), p = key.slice(i + 1).split('/').filter(Boolean);
                if (st != 'trash' && under(st, p)) {
                    const nk = toSt + ':' + [...to, ...p.slice(from.length)].join('/');
                    S.sorts[nk] = S.sorts[key];
                    delete S.sorts[key];
                }
            }
            save();
        }

        async function paste() {
            const c = clip, t = tab();
            if (!c || !t || job) /* 処理中に「ここにコピー」をもう一度押しても、何もしません */
                return;
            const src = stOf(c.st), dst = stOf(t.st);
            if (dst.kind == 'trash') {
                toast('ゴミ箱には貼り付けできません');
                return;
            }
            if (isPc(src) != isPc(dst)) {
                toast('HTML版では、PCフォルダとほかのストレージの間ではコピー・移動できません');
                return;
            }
            const sameDir = c.st == t.st && samePath(c.p, t.p);
            if (c.op == 'move' && sameDir) {
                toast('移動元と同じ場所です');
                return;
            }
            for (const n of c.names) {
                const fp = [...c.p, n];
                if (c.st == t.st && t.p.length >= fp.length && fp.every((x, i) => t.p[i] === x)) {
                    toast(`「${n}」を、その中には${c.op == 'copy' ? 'コピー' : '移動'}できません`);
                    return;
                }
            }
            const move = c.op == 'move';
            const j = jobStart(move ? '移動中' : 'コピー中');
            j.total = c.names.length;
            j.done = 0;
            progDraw();
            /* アプリ版: 量を先に数えて、空き容量が足りるか調べます(同じストレージの中の移動は、場所を変えるだけなので調べません) */
            let sizes = null;
            if (isReal(src) && isReal(dst)) {
                try {
                    sizes = await appCall('sizes', { paths: c.names.map(n => ap(src, c.p, n)) });
                    j.bTotal = sizes.reduce((a, b) => a + b, 0);
                    progDraw();
                    if (!move || c.st != t.st) {
                        const free = await appCall('free', { path: ap(dst, t.p) });
                        if (j.bTotal > free) {
                            jobEnd();
                            dialog({ title: '空き容量が足りません', icon: 'info', html: `${move ? '移動' : 'コピー'}に必要な容量: ${fmtSize(j.bTotal)}<br>${esc(dst.name)}の空き容量: ${fmtSize(free)}<br><br>空きを増やしてから、もう一度試してください。`, ok: '閉じる', cancel: null });
                            return;
                        }
                    }
                }
                catch (e) {
                    console.error(e);
                    sizes = null;
                    j.bTotal = 0;
                }
            }
            const done = [];
            let skip = 0, failed = false, why = '', bBase = 0;
            try {
                for (const [k, name] of c.names.entries()) {
                    if (j.cancel)
                        break;
                    if (sizes) { /* 1つ終わるごとに、量を数え直します(スキップ・上書きしたものも含めて進めます) */
                        j.bDone = bBase;
                        j.bCur = 0;
                        bBase += sizes[k] || 0;
                    }
                    const info = await fsGet(src, c.p, name);
                    if (!info)
                        continue;
                    let dn = name, merge = false;
                    const ex = await fsGet(dst, t.p, name);
                    if (sameDir)
                        dn = await uniqName(dst, t.p, name, info.dir); /* 同じフォルダにコピーしたときは「(2)」を付けます */
                    else if (ex) {
                        const a = await askConflict(j, name, ex.dir && info.dir);
                        if (a == 'cancel') {
                            j.cancel = true;
                            break;
                        }
                        if (a == 'skip') {
                            skip++;
                            continue;
                        }
                        if (a == 'both')
                            dn = await uniqName(dst, t.p, name, info.dir);
                        else if (ex.dir && info.dir)
                            merge = true;
                        else
                            await fsRemove(dst, t.p, name);
                    }
                    await putEntry(j, src, c.p, name, dst, t.p, dn, move, merge);
                    if (j.cancel)
                        break;
                    done.push([name, dn]);
                    j.done++;
                    if (sizes) {
                        j.bDone = bBase;
                        j.bCur = 0;
                    }
                    progDraw();
                }
            }
            catch (e) {
                console.error(e);
                failed = true;
                why = errWhy(e);
            }
            const n = j.done, canceled = j.cancel, cur = j.cur;
            jobEnd();
            if (move) {
                for (const [name, dn] of done)
                    if (!(await fsGet(src, c.p, name).catch(() => null)))
                        rewritePaths(c.st, [...c.p, name], t.st, [...t.p, dn]);
                clip = null;
            }
            const verb = move ? '移動' : 'コピー', sk = skip ? `(${skip}件はスキップ)` : '';
            if (failed)
                toast(`「${cur}」を${verb}できませんでした${why}(${n}件は${verb}済み)`);
            else if (canceled)
                toast(`キャンセルしました(${n}件は${verb}済み)`);
            else if (!n && skip)
                toast(`すべてスキップしました(${skip}件)`);
            else
                toast(`${n}件を${verb}しました${sk}`);
            if (!move)
                clip = null;
            renderAll();
        }

        /* 失敗の理由(アプリ版の Kotlin から返ってくる code)を、お知らせに添える言葉にします */
        function errWhy(e) {
            const c = e && e.code;
            return c == 'nospace' ? '(空き容量が足りません)'
                : c == 'protected' ? '(このフォルダは変更できません)'
                    : c == 'restricted' ? '(Androidの決まりで触れない場所です)'
                        : c == 'denied' ? '(書き込みが許可されていません)'
                            : c == 'perm' ? '(ファイルへのアクセスが許可されていません)' : '';
        }
        /* 消す・移動する・名前を変えることができないフォルダ(ストレージの一番上の「Android」フォルダ)。
           ほかのアプリのデータが入っていて、動かすと壊れることがあるため */
        const isProtected = (st, p, x) => (st.kind == 'local' || st.kind == 'pc') && !p.length && x.dir && x.name.toLowerCase() == 'android';
        function blockProtected(list, verb) {
            const t = tab(), st = stOf(t.st);
            const x = list.find(x => isProtected(st, t.p, x));
            if (!x)
                return false;
            dialog({ title: `${verb}できません`, icon: 'info', html: `「${esc(x.name)}」フォルダには、ほかのアプリのデータが入っています。<br>動かしたり消したりするとアプリが壊れることがあるため、削除・移動・名前の変更はできません。`, ok: '閉じる', cancel: null });
            return true;
        }

        /* ===== 削除とゴミ箱 =====
           内部ストレージ・SDカード・PCフォルダ・Googleドライブ: 各ストレージの一番上の隠しフォルダ(.TaruTrash)の中に
             「.TaruTrash/(番号)/(元の名前)」として移し、元の場所と削除日時を .TaruTrash/index.json に記録します。
             (Googleドライブは、アプリ版ではドライブ自身のゴミ箱を使います。HTML版は同じ仕組みで代わりをします)
           さくら(サーバー): ゴミ箱がないので、確認してから完全に削除します。 */
        const TRASH_DAYS = 30;
        const hasTrash = st => st.kind == 'local' || st.kind == 'pc' || st.kind == 'gdrive';
        async function pcReady() {
            try {
                return !!pcRoot && await pcRoot.queryPermission({ mode: 'readwrite' }) == 'granted';
            }
            catch {
                return false;
            }
        }
        async function tIdx(st) {
            if (isReal(st)) {
                if (st.missing)
                    return [];
                try {
                    const t = await appCall('readText', { path: ap(st, [TRASH], 'index.json') });
                    return (t && JSON.parse(t)) || [];
                }
                catch {
                    return [];
                }
            }
            if (!isPc(st))
                return st._tidx || (st._tidx = []);
            try {
                const f = await (await (await pcDir([TRASH])).getFileHandle('index.json')).getFile();
                return JSON.parse(await f.text()) || [];
            }
            catch {
                return [];
            }
        }
        async function tIdxSave(st, a) {
            if (isReal(st)) {
                await appCall('writeText', { path: ap(st, [TRASH], 'index.json'), text: JSON.stringify(a, null, 1) });
                return;
            }
            if (!isPc(st)) {
                st._tidx = a;
                return;
            }
            const h = await (await pcDir([TRASH])).getFileHandle('index.json', { create: true });
            const w = await h.createWritable();
            await w.write(JSON.stringify(a, null, 1));
            await w.close();
        }
        /* ゴミ箱の一覧(全部のストレージをまとめて表示します) */
        async function listTrash() {
            const out = [];
            for (const st of STORAGES) {
                if (!hasTrash(st) || (isPc(st) && !(await pcReady())))
                    continue;
                for (const e of await tIdx(st).catch(() => []))
                    out.push({ name: st.id + ':' + e.id, label: e.name, dir: e.dir, size: e.size, mtime: e.deleted, tr: { st: st.id, e } });
            }
            return out;
        }
        const daysLeft = e => Math.max(0, TRASH_DAYS - Math.floor((Date.now() - e.deleted) / DAY));
        const fromText = (st, e) => [rootLabel(st), ...e.path].join('/');

        /* ゴミ箱へ移します。戻り値は記録(元に戻すときに使います) */
        async function trashItems(st, p, list) {
            if (!(await fsGet(st, [], TRASH)))
                await fsMkdir(st, [], TRASH);
            const idx = await tIdx(st), out = [];
            const j = jobStart('ゴミ箱に移動中');
            j.total = list.length;
            j.done = 0;
            try {
                for (const x of list) {
                    if (j.cancel)
                        break;
                    const id = Date.now().toString(36) + uid();
                    j.cur = x.name;
                    progDraw();
                    await fsMkdir(st, [TRASH], id);

            const first0 = (list.length == 1 ? (list[0].dir ? list[0].name : list[0].name.replace(/\.[^.]*$/, '') || list[0].name) : (t.p[t.p.length - 1] || rootLabel(st))) + '.zip';
            const first = await fsGet(st, t.p, first0) ? await uniqName(st, t.p, first0, false) : first0;
            let v = await askName('zipに圧縮', 'zipAdd', first, '圧縮', async v => {
                const n = /\.zip$/i.test(v) ? v : v + '.zip';
                return await fsGet(st, t.p, n) ? `「${n}」はすでにあります` : '';
            });
            if (v == null)
                return;
            if (!/\.zip$/i.test(v))
                v += '.zip';
            const j = jobStart('圧縮中');
            j.total = list.length;
            j.done = 0;
            j.bytes = 0;
            let err = null;
            try {
                const ents = [];
                for (const x of list) {
                    await zipCollect(j, st, t.p, x.name, '', ents);
                    j.done++;
                    progDraw();
                }
                if (!j.cancel) {
                    if (ents.length > 65000)
                        throw { code: 'toobig' };
                    if (isPc(st)) {
                        const blob = await zipBuild(j, ents);
                        if (blob)
                            await fsWrite(st, t.p, v, blob);
                    }
                    else {
                        /* ダミー: 中の一覧を覚えておきます(大きさはおおよそ) */
                        const size = Math.round(ents.reduce((a, e) => a + (e.size || 0), 0) * 0.8);
                        demoDir(st, t.p).c[v] = { dir: false, size, mtime: Date.now(), zip: ents.map(e => ({ path: e.path, dir: e.dir, size: e.size })) };
                    }
                }
            }
            catch (e) {
                console.error(e);
                err = e;
            }
            const canceled = j.cancel;
            jobEnd();
            if (err) {
                await fsRemove(st, t.p, v).catch(() => 0); /* 作りかけのzipは消します */
                toast(zipErrText(err, '圧縮'));
            }
            else if (canceled)
                toast('圧縮をキャンセルしました');
            else {
                exitSelect();
                toast(`「${v}」を作成しました`);
            }
            renderMain();
        }

        /* 展開(zipをタップ、または 選択 → その他 → 展開) */
        async function unzipAsk(x) {
            if (notYet('①-3'))
                return;
            const base = x.name.replace(/\.zip$/i, '') || 'zip';
            const how = await askSheet(`「${x.name}」を展開しますか?`,
                `<button class="sb" data-r="folder">${sv('folderB')}「${esc(base)}」フォルダに展開</button>`
                + `<button class="sb sec" data-r="here">ここに展開</button>`
                + `<div class="note">パスワード付きのzipは展開できません</div>`);
            if (how)
                unzip(x, how == 'folder');
        }
        async function unzip(x, inFolder) {
            const t = tab(), st = stOf(t.st);
            const base = x.name.replace(/\.zip$/i, '') || 'zip';
            let dest = [...t.p], made = '';
            const j = jobStart('展開中');
            let err = null, n = 0, skip = 0;
            try {
                /* 中の一覧 */
                let list, u8 = null;
                if (isPc(st)) {
                    u8 = (await fsRead(st, t.p, x.name)).u8;
                    if (u8.length > ZIP_MAX)
                        throw { code: 'toobig' };
                    list = zipParse(u8);
                }
                else {
                    const node = demoDir(st, t.p).c[x.name];
                    /* ダミーで、中の一覧を覚えていないzipは、見本の中身にします */
                    list = (node && node.zip) || [{ path: base + '/', dir: true }, { path: base + '/readme.txt', dir: false, size: 1200 }, { path: base + '/image_01.jpg', dir: false, size: 820000 }];
                }
                if (inFolder) {
                    made = await fsGet(st, t.p, base) ? await uniqName(st, t.p, base, true) : base;
                    await fsMkdir(st, t.p, made);
                    dest = [...t.p, made];
                }
                j.total = list.filter(e => !e.dir).length;
                j.done = 0;
                for (const e of list) {
                    if (j.cancel)
                        break;
                    const segs = zipSafe(e.path);
                    if (!segs || !segs.length) {
                        skip++;
                        continue;
                    }
                    j.cur = segs[segs.length - 1];
                    progDraw();
                    if (e.dir) {
                        await mkdirP(st, [...dest, ...segs]);
                        continue;
                    }
                    const dir = [...dest, ...segs.slice(0, -1)];
                    await mkdirP(st, dir);
                    let fn = segs[segs.length - 1];
                    const ex = await fsGet(st, dir, fn);
                    if (ex) {
                        const a = await askConflict(j, fn, false);
                        if (a == 'cancel') {
                            j.cancel = true;
                            break;
                        }
                        if (a == 'skip') {
                            skip++;
                            continue;
                        }
                        if (a == 'both')
                            fn = await uniqName(st, dir, fn, false);
                        else
                            await fsRemove(st, dir, fn);
                    }
                    if (isPc(st)) {
                        const data = await zipData(u8, e);
                        await fsWrite(st, dir, fn, data);
                    }
                    else
                        demoDir(st, dir).c[fn] = { dir: false, size: e.size || 0, mtime: Date.now() };
                    j.done++;
                    n++;
                    progDraw();
                }
            }
            catch (e) {
                console.error(e);
                err = e;
            }
            const canceled = j.cancel;
            jobEnd();
            if (err) {
                if (made && !n)
                    await fsRemove(st, t.p, made).catch(() => 0); /* 何も出せなかったときは、作ったフォルダを消します */
                toast(zipErrText(err, '展開'));
            }
            else if (canceled)
                toast(`展開をキャンセルしました(${n}件は展開済み)`);
            else
                toast(`${made ? `「${made}」に` : ''}${n}件を展開しました${skip ? `(${skip}件はスキップ)` : ''}`);
            exitSelect();
            renderMain();
        }
        const isZip = x => !x.dir && /\.zip$/i.test(x.name);

        async function newFolder() {
            const t = tab(), st = stOf(t.st);
            if (!t)
                return;
            let first;
            try {
                first = await fsGet(st, t.p, '新しいフォルダ') ? await uniqName(st, t.p, '新しいフォルダ', true) : '新しいフォルダ';
            }
            catch {
                toast('このフォルダには作れません');
                return;
            }
            const v = await askName('新しいフォルダ', 'newFolder', first, '作成', async v => await fsGet(st, t.p, v) ? `「${v}」はすでにあります` : '');
            if (v == null)
                return;
            try {
                await fsMkdir(st, t.p, v);
                toast(`「${v}」を作成しました`);
            }
            catch (e) {
                console.error(e);
                toast('フォルダを作成できませんでした' + errWhy(e));
            }
            renderMain();
        }

        function showProps() {

        const iconKey = () => ICONS[S.icon] ? S.icon : 'b';
        const appIc = () => `<img class="appic" src="${ICONS[iconKey()].src}" alt="">`;

        /* ===== 表示の色 ===== */
        const mqLight = matchMedia('(prefers-color-scheme: light)');
        const themeNow = () => S.theme == 'light' || S.theme == 'dark' ? S.theme : (mqLight.matches ? 'light' : 'dark');
        function applyTheme() {
            const t = themeNow();
            document.documentElement.dataset.theme = t;
            if (APP && APP.setTheme)
                APP.setTheme(S.theme || 'auto', t == 'dark'); /* 時計の裏の色・区切り線もそろえます */

        /* ===== 設定の画面 ===== */
        const THEMES = [['auto', '端末に合わせる'], ['light', 'ライトモード'], ['dark', 'ダークモード']];
        const THUMBS = [['on', '表示する'], ['off', '表示しない']];
        const LPFBS = [['vib', '振動'], ['none', 'なし']]; /* 長押しのフィードバック(音はあとで足す予定) */
        function openSettings() {
            closeDrawer();
            const ver = APP ? `${appIc()}たるファイラー<br>アプリ版: ${esc(APPVER)}<br>HTML: ${APP_VER}` : `${appIc()}たるファイラー(HTML版)<br>バージョン: ${APP_VER}`;
            const html = `<div class="seth">表示の色</div><div class="seg">`
                + THEMES.map(([k, n]) => `<button data-th="${k}">${n}</button>`).join('') + `</div>`
                + `<div class="seth">サムネイル(画像・動画・APK)</div><div class="seg">`
                + THUMBS.map(([k, n]) => `<button data-tb="${k}">${n}</button>`).join('') + `</div>`
                + `<div class="seth">長押しのフィードバック</div><div class="seg">`
                + LPFBS.map(([k, n]) => `<button data-fb="${k}">${n}</button>`).join('') + `</div>`

                + Object.entries(ICONS).map(([k, v]) => `<button data-ic="${k}"><img src="${v.src}" alt=""><span>${k.toUpperCase()} ${esc(v.name)}</span></button>`).join('') + `</div>`
                + `<div class="setv" id="setVer">${ver}</div>`;
            dialog({ title: '設定', icon: 'gear', html, ok: '閉じる', cancel: null });
            const box = $('modal');
            const mark = () => {
                box.querySelectorAll('[data-th]').forEach(b => b.classList.toggle('on', b.dataset.th == (S.theme || 'auto')));
                box.querySelectorAll('[data-ic]').forEach(b => b.classList.toggle('on', b.dataset.ic == iconKey()));
                box.querySelectorAll('[data-fb]').forEach(b => b.classList.toggle('on', b.dataset.fb == (S.lpFb || 'vib')));
                box.querySelectorAll('[data-tb]').forEach(b => b.classList.toggle('on', b.dataset.tb == (S.thumbs === false ? 'off' : 'on')));
            };
            mark();

                save();
                mark();
                vib(); /* 「振動」を選んだときは、試しに1回振動します */
            });
            box.querySelectorAll('[data-ic]').forEach(b => b.onclick = () => {
                S.icon = b.dataset.ic;

                mark();

                if (v)
                    v.innerHTML = APP ? `${appIc()}たるファイラー<br>アプリ版: ${esc(APPVER)}<br>HTML: ${APP_VER}` : `${appIc()}たるファイラー(HTML版)<br>バージョン: ${APP_VER}`;
                renderTabs(); /* ホームの上のアイコン */
                renderDrawer(); /* ドロワーの一番下のアイコン */
            });
        }

        /* ===== ドロワー ===== */
        function drTop() {
            document.documentElement.style.setProperty('--drTop', $('pathbar').getBoundingClientRect().bottom + 'px');
        }
        const drawerOpen = () => $('drawer').classList.contains('open');
        function openDrawer() {
            drTop();
            renderDrawer();
            $('drawer').classList.add('open');
            $('scrim').hidden = false;
        }
        function closeDrawer() {
            $('drawer').classList.remove('open');
            $('scrim').hidden = true;
        }
        function capHtml(st) {
            if (st.cap) {
                const [u, t] = st.cap;
                return `<div class="sub">${fmtSize(u)} / ${fmtSize(t)} 使用</div><div class="bar"><i style="width:${Math.round(u / t * 100)}%"></i></div>`;
            }
            if (st.kind == 'pc')
                return `<div class="sub">${pcRoot ? esc(pcRoot.name) : '未接続'}(HTML版のテスト用)</div>`;
            if (st.kind == 'server')
                return '<div class="sub">SFTP(デモ)</div>';
            return '';
        }
        function secHtml(key, title, body) {
            const f = !!S.fold[key];
            return `<div class="sec" data-k="${key}"><button class="sech"><span class="ar">${sv(f ? 'right' : 'down')}</span>${title}</button><div class="secb"${f ? ' hidden' : ''}>${body}</div></div>`;
        }
        function renderDrawer() {
            const t = tab() || { st: null, p: [] };
            const stBody = STORAGES.filter(st => !st.hidden).map(st => `<div class="di st${t.st == st.id && !t.p.length ? ' cur' : ''}" data-st="${st.id}"><span class="ic">${ico(st)}</span><div class="tx"><div class="nm">${esc(st.name)}${st.kind == 'gdrive' ? ` <span class="acn">(${esc(acName(st))})</span>` : ''}</div>${capHtml(st)}</div></div>`).join('')
                + `<div class="di add"><span class="ic">${sv('plus')}</span><div class="tx">サーバーを追加</div></div>`;
            const favBody = S.favs.length ? S.favs.map(f => {
                const st = stOf(f.st);
                const where = (st.kind == 'gdrive' ? [acName(st), ...f.p] : f.p).join('/') || st.name;
                return `<div class="di fav${t.st == f.st && samePath(t.p, f.p) ? ' cur' : ''}" data-id="${f.id}"><span class="ic fs">${sv('starOn')}</span><div class="tx"><div class="nm">${esc(f.name)}</div><div class="sub" data-full="${esc(where)}">${ico(st)} <span class="wh">${esc(where)}</span></div></div></div>`;
            }).join('') : `<div class="dnote">パス表示の ${sv('star')} をタップすると、今いる場所を登録できます。</div>`;
            const secs = { storage: secHtml('storage', 'ストレージ', stBody), fav: secHtml('fav', 'お気に入り', favBody) };
            $('secs').innerHTML = S.secOrder.map(k => secs[k]).join('');
            fillTrashCount($('dTrashSub')); /* ゴミ箱の件数と容量(開くたびに数え直します) */
            $('ver').innerHTML = APP ? `${appIc()}<span>たるファイラー アプリ版 ${esc(APPVER)}<br>HTML ${APP_VER}</span>` : `${appIc()}<span>たるファイラー(HTML版) ${APP_VER}</span>`;
            fitHead();
        }
        /* お気に入りの場所が入りきらないときは、頭の部分を「…/」で省略して、今いる側を残します */
        function fitHead() {
            for (const el of $('secs').querySelectorAll('.sub[data-full]')) {
                if (!el.clientWidth)
                    continue;
                const segs = el.dataset.full.split('/');
                for (let k = 1; el.scrollWidth > el.clientWidth && k < segs.length; k++)
                    el.querySelector('.wh').textContent = '…/' + segs.slice(k).join('/');
            }
        }
        function favMenu(it, x, y) {
            const f = S.favs.find(v => v.id == it.dataset.id);
            if (!f)
                return;
            popMenu(x, y, [
                { t: '今のタブで開く', ic: 'openHere', act: () => openSrc(favSrc(f), true) },
                { t: '名前の変更', ic: 'ren', act: async () => {
                    const v = await dialog({ title: 'お気に入りの名前の変更', input: f.name, ok: '変更' });
                    if (v && v.trim()) {
                        f.name = v.trim();
                        S.tabs.forEach(t => {
                            if (t.fav == f.id)
                                t.name = f.name; /* このお気に入りから開いたタブの名前も変えます */
                        });
                        save();
                        renderDrawer();
                        renderTabs();
                    }
                } },
                { t: 'お気に入りから削除', ic: 'del', act: () => { S.favs = S.favs.filter(v => v !== f); save(); renderDrawer(); renderPath(); toast('お気に入りから外しました'); } },
            ]);
        }
        function storageMenu(it, x, y) {
            if (!it.dataset.st)
                return;
            const st = stOf(it.dataset.st);
            const list = [{ t: '今のタブで開く', ic: 'openHere', act: () => openSrc(stSrc(st), true) }];
            if (st.kind == 'pc')
                list.push({ t: '別のフォルダを選ぶ', ic: 'folderB', act: pickPc });
            if (st.kind == 'server')
                list.push({ t: '接続の設定', ic: 'gear', act: () => toast('サーバーの接続は、' + APPONLY) });
            popMenu(x, y, list);
        }

        /* ===== PCフォルダ(HTML版のテスト用) ===== */
        async function pickPc() {
            if (!window.showDirectoryPicker) {
                toast('このブラウザではフォルダを選べません(PCのChromeで開いてください)');
                return;
            }
            try {
                pcRoot = await window.showDirectoryPicker({ id: 'taruFilerPc', mode: 'readwrite' });
                await idb.set('pcRoot', pcRoot).catch(() => 0);
                if (tab() && tab().st == 'pc')
                    tab().p = [];
                save();
                renderAll();
            }
            catch (e) {
                if (e.name != 'AbortError')
                    toast('フォルダを選べませんでした');
            }
        }
        async function permPc() {
            try {
                if (await pcRoot.requestPermission({ mode: 'readwrite' }) == 'granted')
                    renderAll();
            }
            catch {
                toast('接続できませんでした');
            }
        }

        /* ===== まとめて描き直し ===== */
        function renderAll() {
            renderTabs();
            renderPath();
            renderMain();
            if (drawerOpen())
                renderDrawer();
            updateSel();
        }

        /* ===== 操作の割り当て ===== */
        function wire() {
            pressable($('tabs'), '.tab', {
                tap: (it, e) => {
                    if (e.target.closest('[data-x]'))
                        closeTab(+it.dataset.i);
                    else
                        switchTab(+it.dataset.i);
                },
                long: tabMenu,
            });
            $('crL1').addEventListener('scroll', fadeCrumbs, { passive: true });
            pressable($('crWrap'), '.cr', {
                tap: it => {
                    const t = tab(), d = +it.dataset.d;
                    if (t && d < t.p.length)
                        go(t.st, t.p.slice(0, d));
                },
                long: () => showFullPath(),
            });
            $('bStar').onclick = toggleStar;
            $('bMenu').onclick = () => drawerOpen() ? closeDrawer() : openDrawer();
            $('scrim').onclick = closeDrawer;
            $('bMore').onclick = moreMenu;
            /* フォルダ内検索(︙メニューから開き、✕で閉じます) */
            window.toggleSearch = open => {
                const r = $('searchRow');
                r.hidden = open == null ? !r.hidden : !open;
                if (!r.hidden)
                    $('q').focus();
                else {
                    query = '';
                    $('q').value = '';
                    draw();
                    updateSel();
                }
            };
            $('q').oninput = () => {
                query = $('q').value;
                draw();
                updateSel();
            };
            $('qX').onclick = () => toggleSearch(false);

            const main = $('main');
            pressable(main, '.it', {
                tap: it => {
                    const x = shown.find(v => v.name == it.dataset.n);
                    if (!x)
                        return;
                    if (selMode)
                        toggleSel(x.name);
                    else if (x.tr)
                        trashInfo(x);
                    else if (x.dir)
                        go(tab().st, [...tab().p, x.name]);
                    else if (isZip(x))
                        unzipAsk(x); /* zipはタップで展開の選択画面 */
                    else
                        openFile(x);
                },
                long: it => {
                    if (!sel.has(it.dataset.n) || !selMode)
                        toggleSel(it.dataset.n);
                },
            });
            main.addEventListener('click', e => {
                const hs = e.target.closest('[data-hsec]');
                if (hs) {
                    const k = hs.dataset.hsec;
                    S.homeFold[k] = !S.homeFold[k];
                    save();
                    drawHome(true);
                    return;
                }
                const h = e.target.closest('[data-hst], [data-hfav], [data-htrash]');
                if (h) {
                    if (h.dataset.hst)
                        openSrc(stSrc(stOf(h.dataset.hst)));
                    else if (h.dataset.hfav) {
                        const f = S.favs.find(v => v.id == h.dataset.hfav);
                        if (f)
                            openSrc(favSrc(f));
                    }
                    else
                        openSrc(trashSrc());
                    return;
                }
                const b = e.target.closest('[data-act]');
                if (!b)
                    return;
                const a = b.dataset.act;
                if (a == 'pick')
                    pickPc();
                else if (a == 'perm')
                    permPc();
                else if (a == 'root')
                    go(tab().st, []);
                else if (a == 'appperm')
                    APP && APP.openPermSettings();
                else if (a == 'up')
                    go(tab().st, tab().p.slice(0, -1));
            });
            main.addEventListener('scroll', () => {
                if (!loading && tab())
                    tab().sc = main.scrollTop;
                if (!loading)
                    fsOnScroll();
            }, { passive: true });

            $('selX').onclick = exitSelect;
            $('cbPaste').onclick = paste;
            $('cbX').onclick = () => {
                clip = null;
                updateClip();
                if (!isHome())
                    draw();
            };
            $('progX').onclick = () => {
                if (job) {
                    job.cancel = true;
                    if (APP && APP.cancel)
                        APP.cancel(job.id); /* 大きいファイルのコピーも、途中で止めます */
                }
            };
            $('selAll').onclick = selectAll;
            $('opbar').onclick = e => {
                const b = e.target.closest('[data-op]');
                if (!b || b.disabled)
                    return;
                const op = b.dataset.op;
                if (op == 'more') {
                    const r = b.getBoundingClientRect();
                    opMore({ center: r.left + r.width / 2 }, r.top - 4, true); /* 「その他」の真上に、その他を中心にして出します */
                }
                else if (op == 'copy' || op == 'move')
                    setClip(op);
                else if (op == 'ren')
                    renameSel();
                else if (op == 'del')
                    deleteSel();
                else if (op == 'restore')
                    trashRestoreSel();
                else if (op == 'purge')
                    trashPurgeSel();
                else if (op == 'empty')
                    trashPurgeSel(items, true);
                else if (op == 'cancel')
                    exitSelect();
            };

            /* ドロワー: 見出しタップで格納/展開・長押しで入れ替え、お気に入りは長押しで並べ替え/メニュー */
            const secs = $('secs');
            sortable(secs, { h: '.sech', it: '.sec' }, {
                tap: it => {
                    const k = it.dataset.k;
                    S.fold[k] = !S.fold[k];
                    save();
                    renderDrawer();
                },
                drop: () => {
                    S.secOrder = [...secs.querySelectorAll('.sec')].map(e => e.dataset.k);
                    save();
                    renderDrawer();
                },
            });
            sortable(secs, { h: '.fav', it: '.fav' }, {
                tap: it => {
                    const f = S.favs.find(v => v.id == it.dataset.id);
                    if (f)
                        openSrc(favSrc(f)); /* ドロワーは閉じずに、新しいタブで開きます */
                },
                menu: favMenu,
                drop: () => {
                    const ids = [...secs.querySelectorAll('.fav')].map(e => e.dataset.id);
                    S.favs = ids.map(id => S.favs.find(f => f.id == id)).filter(Boolean);
                    save();
                    renderDrawer();
                },
            });
            pressable(secs, '.di.st, .di.add', {
                tap: it => {
                    if (it.classList.contains('add')) {
                        toast('サーバーの追加は、' + APPONLY);
                        return;
                    }
                    openSrc(stSrc(stOf(it.dataset.st)));
                },
                long: storageMenu,
            });
            $('dTrash').onclick = () => openSrc(trashSrc()); /* ゴミ箱はタブで開きます(ドロワーは開いたまま) */
            $('dSet').onclick = openSettings;

            /* キーボード(PCで試すとき用): Esc=閉じる / Backspace=1つ上の階層へ */
            document.addEventListener('keydown', e => {
                const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
                if (e.key == 'Escape') {
                    if (!$('pop').hidden)
                        $('pop').hidden = true;
                    else if (closeModal)
                        closeModal();
                    else if (drawerOpen())
                        closeDrawer();
                    else if (!$('searchRow').hidden)
                        toggleSearch(false);
                    else if (selMode)
                        exitSelect();
                    else if (clip) {
                        clip = null;
                        updateClip();
                        if (!isHome())
                            draw();
                    }
                }
                else if (e.key == 'Backspace' && !typing && !closeModal && tab() && tab().p.length)
                    go(tab().st, tab().p.slice(0, -1));
            });
            window.addEventListener('resize', () => {
                drTop();
                if (!isHome())
                    layoutCrumbs(tab().p); /* 幅が変わったら、パスの1行・2行を並べ直します */
            });
            window.addEventListener('pagehide', save);
            document.addEventListener('visibilitychange', save);
        }

        /* ===== アプリ版: アプリに戻ってきたとき(Kotlinが呼びます) =====
           許可の状態とストレージ(SDカードの抜き差し)を確かめ直して、表示を描き直します */
        window.taruResume = () => {
            if (!APP || closeModal)
                return;
            applyAppStorages();
            renderAll();
        };

        /* ===== アプリ版: 戻るボタン(Kotlinが呼びます) =====
           メニュー → ウインドウ → ドロワー → フォルダ内検索 → 選択 の順に閉じて、
           なければ1つ上のフォルダへ。一番上・ホームでは何もしません(アプリは閉じない) */
        window.taruBack = () => {
            if (job) /* 処理中(進み具合のウインドウ)は、戻るボタンでは何もしません。止めるときは「キャンセル」 */
                return;
            if (!$('pop').hidden)
                $('pop').hidden = true;
            else if (closeModal)
                closeModal();
            else if (drawerOpen())
                closeDrawer();
            else if (!$('searchRow').hidden)
                toggleSearch(false);
            else if (selMode)
                exitSelect();
            else if (!job && tab() && tab().p.length)
                go(tab().st, tab().p.slice(0, -1));
        };

        /* ===== アプリ版: 横画面のカメラの穴の幅(CSSのpx)。Kotlinが呼びます ===== */
        window.taruInsets = (l, r) => {
            const st = document.documentElement.style;
            st.setProperty('--cutL', (l | 0) + 'px');
            st.setProperty('--cutR', (r | 0) + 'px');
            drTop();
            if (!isHome())
                layoutCrumbs(tab().p);
        };

        /* ===== スクロールのつまみ =====
           一覧がだいたい3画面分より長いときだけ、スクロールを始めると右端に出す。止めて約1.5秒で消える。
           つまみをドラッグすると、その位置までスクロールする(一番上〜一番下) */
        const FS_H = 48;
        let fsTimer = 0, fsDrag = null;
        function fsEl() {
            let el = $('fs');
            if (!el) {
                el = document.createElement('div');
                el.id = 'fs';
                el.innerHTML = '<svg viewBox="0 0 16 28"><path d="M8 3l5 7H3zM8 25l-5-7h10z" fill="currentColor"/></svg>';
                document.body.appendChild(el);
                el.addEventListener('pointerdown', e => {
                    e.preventDefault();
                    e.stopPropagation();
                    const r = el.getBoundingClientRect();
                    fsDrag = { dy: e.clientY - r.top };
                    el.setPointerCapture(e.pointerId);
                    el.classList.add('drag');
                    clearTimeout(fsTimer);
                });
                el.addEventListener('pointermove', e => {
                    if (!fsDrag)
                        return;
                    const main = $('main'), mr = main.getBoundingClientRect();
                    const range = mr.height - FS_H, max = main.scrollHeight - main.clientHeight;
                    const k = Math.min(1, Math.max(0, (e.clientY - fsDrag.dy - mr.top) / Math.max(1, range)));
                    main.scrollTop = k * max;
                    fsPlace();
                });
                const end = () => {
                    if (!fsDrag)
                        return;
                    fsDrag = null;
                    el.classList.remove('drag');
                    fsHideLater();
                };
                el.addEventListener('pointerup', end);
                el.addEventListener('pointercancel', end);
                el.addEventListener('click', e => e.stopPropagation());
            }
            return el;
        }
        function fsPlace() {
            const main = $('main'), el = fsEl(), mr = main.getBoundingClientRect();
            const max = main.scrollHeight - main.clientHeight;
            const k = max > 0 ? main.scrollTop / max : 0;
            el.style.top = Math.round(mr.top + k * (mr.height - FS_H)) + 'px';
        }
        function fsHideLater() {
            clearTimeout(fsTimer);
            fsTimer = setTimeout(() => {
                if (!fsDrag)
                    fsHide();
            }, 1500);
        }
        function fsHide() {
            const el = $('fs');
            if (el)
                el.classList.remove('on');
            $('main').classList.remove('fsing');
        }
        function fsOnScroll() {
            const main = $('main');
            if (isHome() || main.scrollHeight < main.clientHeight * 3) {
                fsHide();
                return;
            }
            fsPlace();
            fsEl().classList.add('on');
            main.classList.add('fsing');
            if (!fsDrag)
                fsHideLater();
        }

        /* ===== 起動 ===== */
        (async () => {
            try {
                pcRoot = (await idb.get('pcRoot')) || null;
            }
            catch { }
            document.querySelectorAll('i[data-sv]').forEach(e => e.outerHTML = sv(e.dataset.sv)); /* HTMLに書いたアイコンをSVGにします */
            applyIcon();
            applyTheme();
            /* サムネイルが読み込めたら、種類の絵と入れ替えます(load は泡立たないので、捕まえる側で受けます) */
            $('main').addEventListener('load', e => {
                const t = e.target;
                if (!t.classList || !t.classList.contains('th'))
                    return;
                const ic = t.closest('.ic');
                if (!ic)
                    return;
                /* 写真・動画は、形のまま枠に収まる大きさにする(小さい画像も枠まで広げる)。ギャラリーはCSSで正方形に切り取る */
                if (!t.classList.contains('apk') && !t.closest('.gal') && t.naturalWidth && t.naturalHeight) {
                    const box = t.closest('.grid') ? 56 : 32, k = Math.min(box / t.naturalWidth, box / t.naturalHeight);
                    t.style.width = Math.max(1, Math.round(t.naturalWidth * k)) + 'px';
                    t.style.height = Math.max(1, Math.round(t.naturalHeight * k)) + 'px';
                }
                ic.classList.add('thok');
            }, true);
            if (APP && APP.cutout) {
                try {
                    const c = JSON.parse(APP.cutout());
                    document.documentElement.style.setProperty('--cutL', (c.l | 0) + 'px');
                    document.documentElement.style.setProperty('--cutR', (c.r | 0) + 'px');
                }
                catch { }
            }
            wire();
            renderAll();
            drTop();
            autoPurge().then(() => {
                if (isHome() || isTrash())
                    renderMain();
            });
        })();
    </script>
</body>

</html>
