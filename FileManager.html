    <style>
        /* ===== 色(暗い配色が基本。端末やブラウザが明るい表示のときは明るい配色) ===== */
        :root {
            --bg: #14171c;
            --panel: #1c2129;
            --panel2: #262d38;
            --line: #2f3844;
            --tx: #e6e9ee;
            --tx2: #9aa4b2;
            --acc: #4da3ff;
            --accSoft: rgba(77, 163, 255, .18);
            --star: #f5c518;
            --danger: #ff6b6b;
            --scrim: rgba(0, 0, 0, .5);
            --shadow: 0 6px 24px rgba(0, 0, 0, .45);
            color-scheme: dark;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f6f7f9;
                --panel: #ffffff;
                --panel2: #eceff4;
                --line: #d9dee5;
                --tx: #1d232b;
                --tx2: #5f6b7a;
                --acc: #1a73e8;
                --accSoft: rgba(26, 115, 232, .12);
                --star: #e6a700;
                --danger: #d93025;
                --scrim: rgba(0, 0, 0, .35);
                --shadow: 0 6px 24px rgba(0, 0, 0, .18);
                color-scheme: light;
            }
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        /* SVGアイコン: 大きさは周りの文字の大きさに合わせます */
        .sv {
            display: inline-block;
            width: 1.15em;
            height: 1.15em;
            line-height: 0;
            vertical-align: -.22em;
        }

        .sv svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--tx);
            font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
            font-size: 15px;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }

        body {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        button {
            font: inherit;
            color: inherit;
            background: none;
            border: 0;
            padding: 0;
            cursor: pointer;
            touch-action: manipulation;
        }

        /* ===== 画面全体 ===== */
        #app {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        header {
            display: flex;
            align-items: center;
            gap: 2px;
            min-height: 48px;
            padding: 0 4px;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
        }

        .ib {
            flex: none;
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            font-size: 20px;
        }

        .ib.sm {
            width: 36px;
            height: 36px;
            font-size: 18px;
        }

        .ib:active,
        .tb:active,
        .cr:active,
        .di:active,
        #opbar button:active {
            background: var(--panel2);
        }

        /* ===== タブ ===== */
        #tabs {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 3px;
            height: 48px;
            padding: 0 2px 0 4px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        #tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            flex: none;
            display: flex;
            align-items: center;
            gap: 3px;
            height: 30px;
            padding: 0 7px;
            border: 1px solid transparent;
            border-radius: 8px;
            font-size: 13px;
            background: var(--panel2);
            color: var(--tx2);
            white-space: nowrap;
            cursor: pointer;
        }

        .tab.on {
            padding-right: 2px;
            border-color: var(--acc);
            background: var(--accSoft);
            color: var(--tx);
        }

        .tab .ti {
            flex: none;
        }

        /* Googleドライブのアイコン: 右下にアカウントの頭文字の印(色はアカウントごと)。大きさはアイコンに合わせて変わります */
        .gi {
            position: relative;
            display: inline-block;
            margin-right: .25em; /* 印が後ろの文字に重ならないように */
            line-height: 1;
        }

        .gi .gb {
            position: absolute;
            right: -.3em;
            bottom: -.25em;
            min-width: .72em;
            height: .72em;
            padding: 0 .1em;
            border-radius: .36em;
            color: #fff;
            font-family: system-ui, sans-serif;
            font-size: 1em;
            font-style: normal;
            line-height: .72em;
            text-align: center;
        }

        .gi .gb b {
            display: inline-block;
            font-size: .55em;
            font-weight: 700;
            line-height: inherit;
            vertical-align: top;
            transform: translateY(.03em);
        }

        /* タブの名前は8文字分くらいまで(超えたら「…」)。「Googleドライブ」は切れずに入ります */
        .tab .tl {
            max-width: 8em;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tab .tx {
            flex: none;
            display: grid;
            place-items: center;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            color: var(--tx2);
            font-size: 11px;
        }

        /* ホームのときにタブの欄に出す、アプリのアイコンと名前 */
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-left: 8px;
            font-weight: 700;
            white-space: nowrap;
        }

        .brand .appic {
            width: 26px;
            height: 26px;
        }

        /* ===== 選択中の上部 ===== */
        #selCount {
            flex: 1;
            padding-left: 6px;
            font-weight: 600;
        }

        .tb {
            padding: 9px 14px;
            border-radius: 9px;
            color: var(--acc);
            font-weight: 600;
        }

        /* ===== パス表示 ===== */
        #pathbar {
            display: flex;
            align-items: center;
            gap: 2px;
            min-height: 46px;
            padding: 0 4px;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
        }

        .star {
            color: var(--tx2);
        }

        .star.on {
            color: var(--star);
        }

        /* パス: 先頭(ストレージ名 + ›)は固定し、その後ろのフォルダ部分だけを横にスクロールします */
        #crWrap {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
        }

        #crRoot {
            flex: none;
            display: flex;
            align-items: center;
            max-width: 40vw;
            white-space: nowrap;
        }

        /* 先頭は2行(上にアイコン、下にストレージ名)にして幅を詰めます */
        #crRoot .cr {
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            padding: 3px 5px;
            line-height: 1.15;
        }

        #crRoot .rti {
            font-size: 15px;
        }

        #crRoot .rtn {
            max-width: 100%;
            overflow: hidden;
            font-size: 10.5px;
            text-overflow: ellipsis;
        }

        #crRoot .cr.one {
            flex-direction: row;
            gap: 5px;
            font-size: 13px;
        }

        #crumbs {
            flex: 1;
            min-width: 0;
            display: flex;

    <script>

           タブが覚えるもの: st / p(場所)・fav(開いたお気に入りのID)・from(開いたストレージ「st:〇〇」)・name(名前) */
        S.tabs.forEach(t => {
            if (t.name != null)
                return;
            const f = findFav(t.st, t.p);
            if (f) {
                t.fav = f.id;
                t.name = f.name;
            }
            else {
                t.from = 'st:' + t.st;
                t.name = stOf(t.st).name;
            }
        });
        const tabName = t => {
            const st = stOf(t.st);
            return st.kind == 'gdrive' ? st.name : (t.name || st.name);
        };

        /* ===== 小さな保存箱(PCフォルダの接続情報を覚えておくため) ===== */
        const idb = (() => {
            let pr;
            const open = () => pr || (pr = new Promise((res, rej) => {
                const r = indexedDB.open('taruFiler', 1);
                r.onupgradeneeded = () => r.result.createObjectStore('kv');
                r.onsuccess = () => res(r.result);
                r.onerror = () => rej(r.error);
            }));
            const tx = async (mode, fn) => {
                const db = await open();
                return new Promise((res, rej) => {
                    const t = db.transaction('kv', mode);
                    const q = fn(t.objectStore('kv'));
                    t.oncomplete = () => res(q && q.result);
                    t.onerror = () => rej(t.error);
                });
            };
            return {
                get: k => tx('readonly', s => s.get(k)),
                set: (k, v) => tx('readwrite', s => s.put(v, k)),
            };
        })();

        /* ===== ストレージの読み込み(アプリ版ではここを差し替えます) ===== */
        let pcRoot = null;
        async function pcDir(p) {
            let h = pcRoot;
            for (const n of p)
                h = await h.getDirectoryHandle(n);
            return h;
        }
        async function listPc(p) {
            if (!pcRoot)
                throw { code: 'pcnone' };
            if (await pcRoot.queryPermission({ mode: 'readwrite' }) != 'granted')
                throw { code: 'pcperm' };
            let h;
            try {
                h = await pcDir(p);
            }
            catch {
                throw { code: 'notfound' };
            }
            const jobs = [];
            for await (const [name, e] of h.entries()) {
                if (e.kind == 'directory')
                    jobs.push(Promise.resolve({ name, dir: true, size: null, mtime: null }));
                else
                    jobs.push(e.getFile().then(f => ({ name, dir: false, size: f.size, mtime: f.lastModified }), () => ({ name, dir: false, size: null, mtime: null })));
            }
            return Promise.all(jobs);
        }
        async function listDir(st, p) {
            if (st.kind == 'pc')
                return listPc(p);
            if (st.kind == 'server' || st.kind == 'gdrive')
                await sleep(220); /* ネット越しの読み込みの雰囲気を出すため、少し待ちます */
            let n = st.demo;
            for (const s of p) {
                n = n.c[s];
                if (!n || !n.dir)
                    throw { code: 'notfound' };
            }
            return Object.entries(n.c).map(([name, v]) => ({ name, dir: v.dir, size: v.dir ? null : v.size, mtime: v.mtime }));
        }
        function realPath(st, p) {
            const base = st.kind == 'pc' ? (pcRoot ? pcRoot.name : 'PCフォルダ') : st.real;
            return [base, ...p].join('/');
        }

        /* ===== 表示用の小物 ===== */
        const ext = n => {
            const i = n.lastIndexOf('.');
            return i > 0 ? n.slice(i + 1).toLowerCase() : '';
        };
        const TYPES = [
            [sv('image'), '画像', /^(jpe?g|png|gif|webp|bmp|heic|svg|ico)$/],
            [sv('video'), '動画', /^(mp4|mov|mkv|avi|webm|3gp)$/],
            [sv('music'), '音楽', /^(mp3|m4a|aac|flac|wav|ogg)$/],
            [sv('pdf'), 'PDF', /^pdf$/],
            [sv('zip'), '圧縮ファイル', /^(zip|rar|7z|gz|tar)$/],
            [sv('apk'), 'アプリ(APK)', /^apk$/],
            [sv('doc'), '文書', /^(docx?|odt|rtf)$/],
            [sv('sheet'), '表計算', /^(xlsx?|csv|ods)$/],
            [sv('web'), 'Webファイル', /^(html?|css|js|php|json|xml)$/],
            [sv('text'), 'テキスト', /^(txt|md|log|ini|cfg)$/],
        ];
        function ftype(n) {
            const e = ext(n);
            return TYPES.find(t => t[2].test(e)) || [sv('file'), e ? e.toUpperCase() + 'ファイル' : 'ファイル'];
        }
        function fmtSize(b) {
            if (b == null)
                return '—';
            const u = ['B', 'KB', 'MB', 'GB', 'TB'];
            let i = 0;
            while (b >= 1024 && i < 4) {
                b /= 1024;
                i++;
            }
            return (i && b < 100 ? b.toFixed(1) : Math.round(b)) + ' ' + u[i];
        }
        function fmtDate(t) {
            if (!t)
                return '';
            const d = new Date(t);
            return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }
        const COL = new Intl.Collator('ja', { numeric: true, sensitivity: 'base' });

        let toastT;
        function toast(s) {
            const t = $('toast');
            t.textContent = s;
            t.classList.add('show');
            clearTimeout(toastT);
            toastT = setTimeout(() => t.classList.remove('show'), 2400);
        }

        /* 長押しのあとに続く「クリック」を1回だけ無視します(長押しで開いたメニューを誤って押さないため) */
        let suppress = false;
        document.addEventListener('pointerdown', () => suppress = false, true);
        document.addEventListener('click', e => {
            if (suppress) {
                suppress = false;
                e.stopPropagation();
                e.preventDefault();
            }
        }, true);

        /* タップ(tap)と長押し(long)。PCでは右クリックも長押しと同じ扱いです */
        function pressable(box, sel, { tap, long }) {
            let st = null;
            box.addEventListener('pointerdown', e => {
                const it = e.target.closest(sel);
                if (!it || !box.contains(it) || e.button > 0)
                    return;
                st = { it, x: e.clientX, y: e.clientY, id: e.pointerId };
                st.t = setTimeout(() => {
                    if (!st || st.done)
                        return;
                    st.done = true;
                    suppress = true;
                    vib();
                    long(st.it, st.x, st.y);
                }, 480);
            });
            box.addEventListener('pointermove', e => {
                if (st && e.pointerId == st.id && Math.hypot(e.clientX - st.x, e.clientY - st.y) > 10) {
                    clearTimeout(st.t);
                    st = null;
                }
            });
            const end = () => {
                if (st)
                    clearTimeout(st.t);
                st = null;
            };
            box.addEventListener('pointerup', end);
            box.addEventListener('pointercancel', end);
            box.addEventListener('contextmenu', e => {
                const it = e.target.closest(sel);
                if (!it || !box.contains(it))
                    return;
                e.preventDefault();
                if (st && st.done)
                    return;
                if (st) {
                    clearTimeout(st.t);
                    st.done = true;
                }
                suppress = true;
                long(it, e.clientX, e.clientY);
            });
            if (tap)
                box.addEventListener('click', e => {
                    const it = e.target.closest(sel);
                    if (it && box.contains(it))
                        tap(it, e);
                });
        }

        /* 長押しして動かすと並べ替え(drop)、動かさずに離すとメニュー(menu)、ふつうのタップは tap */
        function sortable(box, sel, { tap, menu, drop }) {
            let st = null;
            box.addEventListener('pointerdown', e => {
                const h = e.target.closest(sel.h);
                if (!h || !box.contains(h) || e.button > 0)
                    return;
                st = { h, it: h.closest(sel.it), x: e.clientX, y: e.clientY, id: e.pointerId };
                st.t = setTimeout(() => {
                    if (!st)
                        return;
                    st.armed = true;
                    suppress = true;
                    vib();
                    st.it.classList.add('lift');
                }, 450);
            });
            window.addEventListener('pointermove', e => {
                if (!st || e.pointerId != st.id)
                    return;
                const d = Math.hypot(e.clientX - st.x, e.clientY - st.y);
                if (!st.armed) {
                    if (d > 10) {
                        clearTimeout(st.t);
                        st = null;
                    }
                    return;
                }
                if (d > 6)
                    st.drag = true;
                if (st.drag)
                    place(st.it, e.clientY, sel.it);
            });
            window.addEventListener('pointerup', e => {
                if (!st || e.pointerId != st.id)
                    return;
                clearTimeout(st.t);
                const s = st;
                st = null;
                s.it.classList.remove('lift');
                if (s.drag)
                    drop();
                else if (s.armed && menu)
                    menu(s.it, e.clientX, e.clientY);
            });
            window.addEventListener('pointercancel', () => {
                if (!st)
                    return;
                clearTimeout(st.t);
                st.it.classList.remove('lift');
                if (st.drag)
                    drop();
                st = null;
            });
            document.addEventListener('touchmove', e => {
                if (st && st.armed)
                    e.preventDefault(); /* 並べ替え中は画面がスクロールしないようにします */
            }, { passive: false });
            box.addEventListener('contextmenu', e => {
                const h = e.target.closest(sel.h);
                if (!h || !box.contains(h))
                    return;
                e.preventDefault();
                if (st || !menu)
                    return;
                suppress = true;
                menu(h.closest(sel.it), e.clientX, e.clientY);
            });
            if (tap)
                box.addEventListener('click', e => {
                    const h = e.target.closest(sel.h);
                    if (h && box.contains(h))
                        tap(h.closest(sel.it), e);
                });
        }
        /* 並べ替え中: 指の位置に合わせて、離す前に並びを入れ替えて見せます */
        function place(it, y, isel) {
            const par = it.parentNode;
            const sibs = [...par.children].filter(c => c !== it && c.matches(isel));
            const before = sibs.find(c => {
                const r = c.getBoundingClientRect();
                return y < r.top + r.height / 2;
            });
            if (before) {
                if (it.nextElementSibling !== before)
                    par.insertBefore(it, before);
            }
            else if (sibs.length) {
                const last = sibs[sibs.length - 1];
                if (last.nextElementSibling !== it)
                    last.after(it);
            }
        }

        /* ===== メニュー(︙・長押し) ===== */
        function popMenu(x, y, list, up = false) {
            const pop = $('pop');
            pop.innerHTML = '<div class="pm">' + list.map((m, i) => m == '-' ? '<hr>'
                : `<button data-i="${i}"${m.dis ? ' disabled' : ''}><span class="pc">${m.chk ? sv('check') : (m.ic ? sv(m.ic) : '')}</span>${esc(m.t)}</button>`).join('') + '</div>';
            pop.hidden = false;
            const pm = pop.firstChild, r = pm.getBoundingClientRect();
            pm.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + 'px';
            pm.style.top = Math.max(8, Math.min(up ? y - r.height : y, innerHeight - r.height - 8)) + 'px'; /* up: 指定位置の上側に出します */
            pop.onclick = e => {
                const b = e.target.closest('button[data-i]');
                if (e.target === pop || b)
                    pop.hidden = true;
                if (b)
                    list[+b.dataset.i].act();
            };
        }

        /* ===== ウインドウ(確認・入力・情報) ===== */
        let closeModal = null;
        function dialog({ title, icon = '', html = '', input = null, ok = 'OK', cancel = 'キャンセル', danger = false }) {
            return new Promise(res => {
                const m = $('modal');
                m.innerHTML = `<div class="dlg" role="dialog"><h3>${icon ? sv(icon) + ' ' : ''}${esc(title)}</h3><div class="bd">${html}</div>`
                    + (input != null ? `<input id="dlgIn" value="${esc(input)}">` : '')
                    + `<div class="bt">${cancel ? `<button data-r="0">${esc(cancel)}</button>` : ''}<button data-r="1" class="ok${danger ? ' danger' : ''}">${esc(ok)}</button></div></div>`;
                m.hidden = false;
                const inp = $('dlgIn');
                const done = r => {
                    m.hidden = true;
                    m.innerHTML = '';
                    closeModal = null;
                    res(r ? (inp ? inp.value : true) : null);
                };
                closeModal = () => done(0);
                if (inp) {
                    setTimeout(() => {
                        inp.focus();
                        const dot = inp.value.lastIndexOf('.');
                        inp.setSelectionRange(0, dot > 0 ? dot : inp.value.length);
                    }, 30);
                    inp.onkeydown = e => {
                        if (e.key == 'Enter')
                            done(1);
                    };
                }
                m.onclick = e => {
                    const b = e.target.closest('[data-r]');
                    if (b)
                        done(+b.dataset.r);
                    else if (e.target === m)
                        done(0);
                };
            });
        }
        const dl = rows => `<dl class="prop">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;

        /* ===== タブ ===== */
        function renderTabs() {
            const el = $('tabs');
            if (isHome()) {
                el.innerHTML = `<div class="brand">${appIc()}<span>たるファイラー</span></div>`;
                return;
            }
            el.innerHTML = S.tabs.map((t, i) => {
                const st = stOf(t.st);
                const name = tabName(t);
                const close = i == S.cur ? `<span class="tx" data-x="1" aria-label="タブを閉じる">${sv('close')}</span>` : '';
                return `<div class="tab${i == S.cur ? ' on' : ''}" data-i="${i}"><span class="ti">${ico(st)}</span><span class="tl">${esc(name)}</span>${close}</div>`;
            }).join('');
            const on = el.querySelector('.tab.on');
            if (on)
                el.scrollLeft = Math.max(0, Math.min(el.scrollLeft, on.offsetLeft - 4), on.offsetLeft + on.offsetWidth - el.clientWidth + 4);
        }
        function switchTab(i) {
            if (i == S.cur)
                return;
            S.cur = i;
            leaveFolder();
            save();
            renderAll();
        }
        /* タブを増やす(元のタブの名前などを引き継ぎます) */
        function addTab(t, at = S.tabs.length) {
            S.tabs.splice(at, 0, { st: t.st, p: [...t.p], fav: t.fav, from: t.from, name: t.name });
            if (at <= S.cur)
                S.cur++;
            switchTab(at);
        }
        /* ドロワーから開く: 同じお気に入り(ストレージ)のタブがあればそこへ切り替え、なければ新しいタブで開きます。
           here=true のときは今のタブで開きます(タブの名前も変わります) */
        function openSrc(src, here) {
            if (here && !isHome()) {
                const t = tab();
                t.fav = src.fav;
                t.from = src.from;
                t.name = src.name;
                go(src.st, src.p);
                return;
            }
            const i = S.tabs.findIndex(t => src.fav ? t.fav == src.fav : t.from == src.from);
            if (i >= 0)
                switchTab(i);
            else
                addTab(src);
        }
        const favSrc = f => ({ st: f.st, p: f.p, fav: f.id, from: undefined, name: f.name });
        const stSrc = st => ({ st: st.id, p: [], fav: undefined, from: 'st:' + st.id, name: st.name });
        function closeTab(i) {
            S.tabs.splice(i, 1);
            if (i < S.cur || S.cur >= S.tabs.length)
                S.cur = Math.max(0, S.cur - 1); /* 最後のタブを閉じるとホームになります */
            leaveFolder();
            save();
            renderAll();
        }
        function tabMenu(it, x, y) {
            const i = +it.dataset.i, t = S.tabs[i];
            popMenu(x, y, [
                { t: 'このタブを複製', ic: 'dup', act: () => addTab(t, i + 1) },
                { t: 'このタブを閉じる', ic: 'close', act: () => closeTab(i) },
                { t: 'ほかのタブを閉じる', dis: S.tabs.length < 2, act: () => { S.tabs = [t]; S.cur = 0; leaveFolder(); save(); renderAll(); } },
                { t: 'すべてのタブを閉じる', act: () => { S.tabs = []; S.cur = 0; leaveFolder(); save(); renderAll(); } },
            ]);
        }

        /* ===== パス表示とお気に入り登録 ===== */
        function renderPath() {
            const b = $('bStar');
            b.hidden = isHome();
            if (isHome()) {
                $('crRoot').innerHTML = `<span class="cr one last">${sv('home')} ホーム</span>`;

            const c = $('crumbs');

        const fadeCrumbs = () => $('crumbs').classList.toggle('fadeL', $('crumbs').scrollLeft > 2);
        function toggleStar() {
            const t = tab(), f = findFav(t.st, t.p);

        function addFav(stId, p) {
            if (findFav(stId, p))
                return;

        async function showFullPath() {

                return;

        /* ===== フォルダの移動 ===== */
        function leaveFolder() {

            $('q').value = '';

        }
        function go(stId, p) {

        /* ===== メイン表示領域 ===== */
        let items = [], shown = [], mainTok = 0, loading = false, query = '';
        const sel = new Set();
        let selMode = false;
        async function renderMain() {
            if (isHome()) {
                ++mainTok;
                items = [];
                shown = [];
                drawHome();
                return;
            }
            const tok = ++mainTok, t = tab(), st = stOf(t.st), main = $('main');
            loading = true;
            const lt = setTimeout(() => {
                if (tok == mainTok)
                    main.innerHTML = '<div class="msg">読み込み中…</div>';
            }, 120);
            try {
                const r = await listDir(st, t.p);
                if (tok != mainTok)
                    return;
                items = r;
                clearTimeout(lt);
                draw();
                main.scrollTop = t.sc || 0;
            }
            catch (e) {
                clearTimeout(lt);
                if (tok != mainTok)
                    return;

                shown = [];
                showErr(e, st);
            }
            requestAnimationFrame(() => loading = false);
        }
        function showErr(e, st) {
            const code = e && e.code;
            let h;
            if (code == 'pcnone')
                h = 'PCのテスト用フォルダがまだ選ばれていません。<br>中身を消しても困らない、<b>テスト用のフォルダ</b>を選んでください。<br><button class="btn" data-act="pick">フォルダを選ぶ</button>';
            else if (code == 'pcperm')
                h = `前回のフォルダ「${esc(pcRoot.name)}」に接続します。<br><button class="btn" data-act="perm">接続する</button><br><button class="btn" data-act="pick" style="background:var(--panel2);color:var(--tx)">別のフォルダを選ぶ</button>`;
            else if (code == 'notfound')
                h = `このフォルダは見つかりません。<br><button class="btn" data-act="root">${ico(st)} ${esc(rootLabel(st))}の一番上へ</button>`;
            else

            $('main').innerHTML = `<div class="msg">${h}</div>`;
        }
        /* ===== ホーム(タブを全部閉じたとき) ===== */
        function drawHome(keepScroll) {
            const sc = $('main').scrollTop;
            const cards = STORAGES.map(st => {
                const sub = st.kind == 'gdrive' ? `<div class="sub">${esc(acName(st))}</div>` : '';
                return `<button class="hcard" data-hst="${st.id}"><span class="ic">${ico(st)}</span><div class="tx"><div class="nm">${esc(st.name)}</div>${sub}${capHtml(st)}</div></button>`;
            }).join('');
            const favs = S.favs.length ? '<div class="hfavs">' + S.favs.map(f => {
                const st = stOf(f.st);
                /* Googleドライブは、名前の下にアカウント名を小さく出します(高さはほかと同じ) */
                const label = st.kind == 'gdrive' ? `<span class="two"><span class="nm">${esc(f.name)}</span><span class="ac">${esc(acName(st))}</span></span>` : `<span class="nm">${esc(f.name)}</span>`;
                return `<button class="hfav" data-hfav="${f.id}"><span class="fs">${sv('starOn')}</span>${label}</button>`;
            }).join('') + '</div>'
                : `<div class="hnote">パス表示の ${sv('star')} をタップすると、今いる場所をお気に入りに登録できます。</div>`;
            const hf = S.homeFold || (S.homeFold = {});
            const sec = (k, title, body) => `<button class="hsech" data-hsec="${k}"><span class="ar">${sv(hf[k] ? 'right' : 'down')}</span>${title}</button>` + (hf[k] ? '' : body);
            $('main').innerHTML = `<div class="home">` + sec('storage', 'ストレージ', `<div class="hcards">${cards}</div>`)
                + sec('fav', 'お気に入り', favs)
                + `<div class="hsech" style="cursor:default"><span class="ar"></span>ゴミ箱</div><div class="hcards"><button class="hcard" data-htrash="1"><span class="ic">${sv('del')}</span><div class="tx"><div class="nm">ゴミ箱</div><div class="sub">0件・0 B</div></div></button></div></div>`;
            $('main').scrollTop = keepScroll ? sc : 0;
        }
        function visible() {
            let a = items.filter(x => S.hidden || !x.name.startsWith('.'));
            if (query) {
                const q = query.toLowerCase();
                a = a.filter(x => x.name.toLowerCase().includes(q));
            }
            const { k, asc } = S.sort, m = asc ? 1 : -1;
            const by = (x, y) => k == 'date' ? (x.mtime || 0) - (y.mtime || 0)
                : k == 'size' ? (x.size || 0) - (y.size || 0)
                    : k == 'type' ? COL.compare(ext(x.name), ext(y.name))
                        : 0;
            return a.sort((x, y) => (y.dir - x.dir) || m * (by(x, y) || COL.compare(x.name, y.name)));
        }
        function meta(x) {
            if (x.dir)
                return x.mtime ? fmtDate(x.mtime) : 'フォルダ';
            return [fmtDate(x.mtime), fmtSize(x.size)].filter(Boolean).join('・');
        }
        function draw() {
            const main = $('main');
            shown = visible();
            if (!shown.length) {
                main.innerHTML = `<div class="msg">${query ? '一致するものはありません' : 'このフォルダは空です'}</div>`;
                return;
            }
            main.innerHTML = `<div class="${S.view}${selMode ? ' selmode' : ''}">` + shown.map(x => {
                const s = sel.has(x.name);
                return `<div class="it${x.name.startsWith('.') ? ' hid' : ''}${s ? ' sel' : ''}" data-n="${esc(x.name)}">`
                    + `<span class="ck">${s ? sv('check') : ''}</span><span class="ic">${x.dir ? sv('folder') : ftype(x.name)[0]}</span>`
                    + `<div class="tx"><div class="nm">${esc(x.name)}</div><div class="mt">${meta(x)}</div></div></div>`;
            }).join('') + '</div>';
        }
        async function openFile(x) {
            const t = tab(), st = stOf(t.st);
            if (st.kind != 'pc') {
                toast('ファイルを開くのは、' + APPONLY);
                return;
            }
            try {
                const f = await (await (await pcDir(t.p)).getFileHandle(x.name)).getFile();
                const url = URL.createObjectURL(f);
                window.open(url, '_blank');
                setTimeout(() => URL.revokeObjectURL(url), 60000);
            }
            catch {
                toast('ファイルを開けませんでした');
            }
        }

        /* ===== 選択モード ===== */
        function updateSel() {
            if (!sel.size)
                selMode = false;
            $('top').hidden = selMode;
            $('selTop').hidden = !selMode;
            $('opbar').hidden = !selMode;
            $('selCount').textContent = `${sel.size}件選択中`;
            $('selAll').textContent = shown.length && sel.size == shown.length ? '全解除' : '全選択';
            $('opRen').disabled = sel.size != 1;
            const g = $('main').firstElementChild;
            if (g)
                g.classList.toggle('selmode', selMode);
            for (const el of $('main').querySelectorAll('.it')) {
                const s = sel.has(el.dataset.n);
                el.classList.toggle('sel', s);
                el.querySelector('.ck').innerHTML = s ? sv('check') : '';
            }
            drTop();
        }
        function toggleSel(name) {
            if (sel.has(name))
                sel.delete(name);
            else
                sel.add(name);
            selMode = sel.size > 0;
            updateSel();
        }
        function exitSelect() {
            sel.clear();
            selMode = false;
            updateSel();
        }
        function selectAll() {
            if (!shown.length)
                return;
            if (selMode && sel.size == shown.length) {
                exitSelect();
                return;
            }
            shown.forEach(x => sel.add(x.name));
            selMode = true;
            updateSel();
        }
        const selItems = () => shown.filter(x => sel.has(x.name));

        function showProps() {
            const t = tab(), st = stOf(t.st), list = selItems();
            if (!list.length)
                return;
            let html;
            if (list.length == 1) {
                const x = list[0];
                html = dl([
                    ['名前', x.name],
                    ['種類', x.dir ? 'フォルダ' : ftype(x.name)[1]],
                    ['場所', realPath(st, t.p)],
                    ['サイズ', x.dir ? '—' : `${fmtSize(x.size)}(${(x.size || 0).toLocaleString()} バイト)`],
                    ['更新日時', x.mtime ? fmtDate(x.mtime) : '—'],
                ]);
            }
            else {
                const nd = list.filter(x => x.dir).length, nf = list.length - nd;
                const tot = list.reduce((s, x) => s + (x.size || 0), 0);
                html = dl([
                    ['選択', `${list.length}件(フォルダ ${nd}・ファイル ${nf})`],
                    ['場所', realPath(st, t.p)],
                    ['合計サイズ', fmtSize(tot) + (nd ? '(フォルダの中身は含みません)' : '')],
                ]);
            }
            dialog({ title: 'プロパティ', html, ok: '閉じる', cancel: null });
        }
        function opMore(x, y, up) {
            const list = selItems(), one = list.length == 1 ? list[0] : null;
            popMenu(x, y, [
                { t: '共有', ic: 'share', act: () => toast('共有は、' + APPONLY) },
                { t: 'ほかのアプリで開く', ic: 'openWith', dis: !one || one.dir, act: () => openFile(one) },
                { t: 'お気に入りに追加', ic: 'starOn', dis: !one || !one.dir, act: () => { const t = tab(); addFav(t.st, [...t.p, one.name]); save(); renderDrawer(); toast('お気に入りに登録しました'); } },
                { t: 'zipに圧縮', ic: 'zipAdd', act: () => toast(SOON) },
                '-',
                { t: 'プロパティ', ic: 'info', act: showProps },
            ], up);
        }

        /* ===== ︙メニュー ===== */
        function moreMenu() {
            const r = $('bMore').getBoundingClientRect(), x = r.right, y = r.bottom;
            if (isHome()) {
                popMenu(x, y, [{ t: '設定', ic: 'gear', act: openSettings }]);
                return;
            }
            popMenu(x, y, [
                { t: 'フォルダ内検索', ic: 'search', act: () => toggleSearch(true) },
                '-',
                { t: '新しいフォルダ', ic: 'newFolder', act: () => toast(SOON) },
                '-',
                { t: '一覧表示', chk: S.view == 'list', act: () => setView('list') },
                { t: 'アイコン表示', chk: S.view == 'grid', act: () => setView('grid') },
                { t: '並べ替え…', ic: 'sort', act: () => sortMenu(x, y) },
                { t: '隠しファイルを表示', chk: S.hidden, act: () => { S.hidden = !S.hidden; save(); draw(); updateSel(); } },
                '-',
                { t: '全選択', ic: 'selAll', act: selectAll },
                { t: '更新', ic: 'refresh', act: () => renderMain() },
                { t: '設定', ic: 'gear', act: openSettings },
            ]);
        }
        function setView(v) {
            S.view = v;
            save();
            draw();
            updateSel();
        }
        function sortMenu(x, y) {
            const s = S.sort;
            const k = key => () => { s.k = key; save(); draw(); updateSel(); };
            popMenu(x, y, [
                { t: '名前', chk: s.k == 'name', act: k('name') },
                { t: '更新日時', chk: s.k == 'date', act: k('date') },
                { t: 'サイズ', chk: s.k == 'size', act: k('size') },
                { t: '種類', chk: s.k == 'type', act: k('type') },
                '-',
                { t: '昇順', chk: s.asc, act: () => { s.asc = true; save(); draw(); updateSel(); } },
                { t: '降順', chk: !s.asc, act: () => { s.asc = false; save(); draw(); updateSel(); } },
            ]);
        }
        const appIc = () => `<img class="appic" src="${$('appIcon').href}" alt="">`;
        function openSettings() {
            closeDrawer();
            dialog({ title: '設定', icon: 'gear', html: `設定の項目は、これから追加していきます。<br><br>${appIc()}たるファイラー(HTML版)<br>バージョン: ${APP_VER}`, ok: '閉じる', cancel: null });
        }

        /* ===== ドロワー ===== */
        function drTop() {
            document.documentElement.style.setProperty('--drTop', $('pathbar').getBoundingClientRect().bottom + 'px');
        }
        const drawerOpen = () => $('drawer').classList.contains('open');
        function openDrawer() {
            drTop();
            renderDrawer();
            $('drawer').classList.add('open');
            $('scrim').hidden = false;
        }
        function closeDrawer() {
            $('drawer').classList.remove('open');
            $('scrim').hidden = true;
        }
        function capHtml(st) {
            if (st.cap) {
                const [u, t] = st.cap;
                return `<div class="sub">${fmtSize(u)} / ${fmtSize(t)} 使用</div><div class="bar"><i style="width:${Math.round(u / t * 100)}%"></i></div>`;
            }
            if (st.kind == 'pc')
                return `<div class="sub">${pcRoot ? esc(pcRoot.name) : '未接続'}(HTML版のテスト用)</div>`;
            if (st.kind == 'server')
                return '<div class="sub">SFTP(デモ)</div>';
            return '';
        }
        function secHtml(key, title, body) {
            const f = !!S.fold[key];
            return `<div class="sec" data-k="${key}"><button class="sech"><span class="ar">${sv(f ? 'right' : 'down')}</span>${title}</button><div class="secb"${f ? ' hidden' : ''}>${body}</div></div>`;
        }
        function renderDrawer() {
            const t = tab() || { st: null, p: [] };
            const stBody = STORAGES.map(st => `<div class="di st${t.st == st.id && !t.p.length ? ' cur' : ''}" data-st="${st.id}"><span class="ic">${ico(st)}</span><div class="tx"><div class="nm">${esc(st.name)}</div>${st.kind == 'gdrive' ? `<div class="sub">${esc(acName(st))}</div>` : ''}${capHtml(st)}</div></div>`).join('')
                + `<div class="di add"><span class="ic">${sv('plus')}</span><div class="tx">サーバーを追加</div></div>`;
            const favBody = S.favs.length ? S.favs.map(f => {
                const st = stOf(f.st);
                const where = (st.kind == 'gdrive' ? [acName(st), ...f.p] : f.p).join('/') || st.name;
                return `<div class="di fav${t.st == f.st && samePath(t.p, f.p) ? ' cur' : ''}" data-id="${f.id}"><span class="ic fs">${sv('starOn')}</span><div class="tx"><div class="nm">${esc(f.name)}</div><div class="sub" data-full="${esc(where)}">${ico(st)} <span class="wh">${esc(where)}</span></div></div></div>`;
            }).join('') : `<div class="dnote">パス表示の ${sv('star')} をタップすると、今いる場所を登録できます。</div>`;
            const secs = { storage: secHtml('storage', 'ストレージ', stBody), fav: secHtml('fav', 'お気に入り', favBody) };
            $('secs').innerHTML = S.secOrder.map(k => secs[k]).join('');
            $('ver').innerHTML = `${appIc()}<span>たるファイラー(HTML版) ${APP_VER}</span>`;
            fitHead();
        }
        /* お気に入りの場所が入りきらないときは、頭の部分を「…/」で省略して、今いる側を残します */
        function fitHead() {
            for (const el of $('secs').querySelectorAll('.sub[data-full]')) {
                if (!el.clientWidth)
                    continue;
                const segs = el.dataset.full.split('/');
                for (let k = 1; el.scrollWidth > el.clientWidth && k < segs.length; k++)
                    el.querySelector('.wh').textContent = '…/' + segs.slice(k).join('/');
            }
        }
        function favMenu(it, x, y) {
            const f = S.favs.find(v => v.id == it.dataset.id);
            if (!f)
                return;
            popMenu(x, y, [
                { t: '今のタブで開く', ic: 'openHere', act: () => openSrc(favSrc(f), true) },
                { t: '名前の変更', ic: 'ren', act: async () => {
                    const v = await dialog({ title: 'お気に入りの名前の変更', input: f.name, ok: '変更' });
                    if (v && v.trim()) {
                        f.name = v.trim();
                        S.tabs.forEach(t => {
                            if (t.fav == f.id)
                                t.name = f.name; /* このお気に入りから開いたタブの名前も変えます */
                        });
                        save();
                        renderDrawer();
                        renderTabs();
                    }
                } },
                { t: 'お気に入りから削除', ic: 'del', act: () => { S.favs = S.favs.filter(v => v !== f); save(); renderDrawer(); renderPath(); toast('お気に入りから外しました'); } },
            ]);
        }
        function storageMenu(it, x, y) {
            if (!it.dataset.st)
                return;
            const st = stOf(it.dataset.st);
            const list = [{ t: '今のタブで開く', ic: 'openHere', act: () => openSrc(stSrc(st), true) }];
            if (st.kind == 'pc')
                list.push({ t: '別のフォルダを選ぶ', ic: 'folderB', act: pickPc });
            if (st.kind == 'server')
                list.push({ t: '接続の設定', ic: 'gear', act: () => toast('サーバーの接続は、' + APPONLY) });
            popMenu(x, y, list);
        }

        /* ===== PCフォルダ(HTML版のテスト用) ===== */
        async function pickPc() {
            if (!window.showDirectoryPicker) {
                toast('このブラウザではフォルダを選べません(PCのChromeで開いてください)');
                return;
            }
            try {
                pcRoot = await window.showDirectoryPicker({ id: 'taruFilerPc', mode: 'readwrite' });
                await idb.set('pcRoot', pcRoot).catch(() => 0);
                if (tab() && tab().st == 'pc')
                    tab().p = [];
                save();
                renderAll();
            }
            catch (e) {
                if (e.name != 'AbortError')
                    toast('フォルダを選べませんでした');
            }
        }
        async function permPc() {
            try {
                if (await pcRoot.requestPermission({ mode: 'readwrite' }) == 'granted')
                    renderAll();
            }
            catch {
                toast('接続できませんでした');
            }
        }

        /* ===== まとめて描き直し ===== */
        function renderAll() {
            renderTabs();
            renderPath();
            renderMain();
            if (drawerOpen())
                renderDrawer();
            updateSel();
        }

        /* ===== 操作の割り当て ===== */
        function wire() {
            pressable($('tabs'), '.tab', {
                tap: (it, e) => {
                    if (e.target.closest('[data-x]'))
                        closeTab(+it.dataset.i);
                    else
                        switchTab(+it.dataset.i);
                },
                long: tabMenu,
            });
            $('crumbs').addEventListener('scroll', fadeCrumbs, { passive: true });
            pressable($('crWrap'), '.cr', {
                tap: it => {
                    const t = tab(), d = +it.dataset.d;
                    if (t && d < t.p.length)
                        go(t.st, t.p.slice(0, d));
                },
                long: () => showFullPath(),
            });
            $('bStar').onclick = toggleStar;
            $('bMenu').onclick = () => drawerOpen() ? closeDrawer() : openDrawer();
            $('scrim').onclick = closeDrawer;
            $('bMore').onclick = moreMenu;
            /* フォルダ内検索(︙メニューから開き、✕で閉じます) */
            window.toggleSearch = open => {
                const r = $('searchRow');
                r.hidden = open == null ? !r.hidden : !open;
                if (!r.hidden)
                    $('q').focus();
                else {
                    query = '';
                    $('q').value = '';
                    draw();
                    updateSel();
                }
            };
            $('q').oninput = () => {
                query = $('q').value;
                draw();
                updateSel();
            };
            $('qX').onclick = () => toggleSearch(false);

            const main = $('main');
            pressable(main, '.it', {
                tap: it => {
                    const x = shown.find(v => v.name == it.dataset.n);
                    if (!x)
                        return;
                    if (selMode)
                        toggleSel(x.name);
                    else if (x.dir)
                        go(tab().st, [...tab().p, x.name]);
                    else
                        openFile(x);
                },
                long: it => {
                    if (!sel.has(it.dataset.n) || !selMode)
                        toggleSel(it.dataset.n);
                },
            });
            main.addEventListener('click', e => {
                const hs = e.target.closest('[data-hsec]');
                if (hs) {
                    const k = hs.dataset.hsec;
                    S.homeFold[k] = !S.homeFold[k];
                    save();
                    drawHome(true);
                    return;
                }
                const h = e.target.closest('[data-hst], [data-hfav], [data-htrash]');
                if (h) {
                    if (h.dataset.hst)
                        openSrc(stSrc(stOf(h.dataset.hst)));
                    else if (h.dataset.hfav) {
                        const f = S.favs.find(v => v.id == h.dataset.hfav);
                        if (f)
                            openSrc(favSrc(f));
                    }
                    else
                        toast('ゴミ箱は、次の段階(HTML②)で使えるようになります');
                    return;
                }
                const b = e.target.closest('[data-act]');
                if (!b)
                    return;
                const a = b.dataset.act;
                if (a == 'pick')
                    pickPc();
                else if (a == 'perm')
                    permPc();
                else if (a == 'root')
                    go(tab().st, []);
            });
            main.addEventListener('scroll', () => {
                if (!loading && tab())
                    tab().sc = main.scrollTop;
            }, { passive: true });

            $('selX').onclick = exitSelect;
            $('selAll').onclick = selectAll;
            $('opbar').onclick = e => {
                const b = e.target.closest('[data-op]');
                if (!b || b.disabled)
                    return;
                if (b.dataset.op == 'more') {
                    const r = b.getBoundingClientRect();
                    opMore(r.right, r.top - 4, true);
                }
                else
                    toast(SOON);
            };

            /* ドロワー: 見出しタップで格納/展開・長押しで入れ替え、お気に入りは長押しで並べ替え/メニュー */
            const secs = $('secs');
            sortable(secs, { h: '.sech', it: '.sec' }, {
                tap: it => {
                    const k = it.dataset.k;
                    S.fold[k] = !S.fold[k];
                    save();
                    renderDrawer();
                },
                drop: () => {
                    S.secOrder = [...secs.querySelectorAll('.sec')].map(e => e.dataset.k);
                    save();
                    renderDrawer();
                },
            });
            sortable(secs, { h: '.fav', it: '.fav' }, {
                tap: it => {
                    const f = S.favs.find(v => v.id == it.dataset.id);
                    if (f)
                        openSrc(favSrc(f)); /* ドロワーは閉じずに、新しいタブで開きます */
                },
                menu: favMenu,
                drop: () => {
                    const ids = [...secs.querySelectorAll('.fav')].map(e => e.dataset.id);
                    S.favs = ids.map(id => S.favs.find(f => f.id == id)).filter(Boolean);
                    save();
                    renderDrawer();
                },
            });
            pressable(secs, '.di.st, .di.add', {
                tap: it => {
                    if (it.classList.contains('add')) {
                        toast('サーバーの追加は、' + APPONLY);
                        return;
                    }
                    openSrc(stSrc(stOf(it.dataset.st)));
                },
                long: storageMenu,
            });
            $('dTrash').onclick = () => toast('ゴミ箱は、' + SOON.replace('この操作は', ''));
            $('dSet').onclick = openSettings;

            /* キーボード(PCで試すとき用): Esc=閉じる / Backspace=1つ上の階層へ */
            document.addEventListener('keydown', e => {
                const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
                if (e.key == 'Escape') {
                    if (!$('pop').hidden)
                        $('pop').hidden = true;
                    else if (closeModal)
                        closeModal();
                    else if (drawerOpen())
                        closeDrawer();
                    else if (!$('searchRow').hidden)
                        toggleSearch(false);
                    else if (selMode)
                        exitSelect();
                }
                else if (e.key == 'Backspace' && !typing && !closeModal && tab() && tab().p.length)
                    go(tab().st, tab().p.slice(0, -1));
            });
            window.addEventListener('resize', drTop);
            window.addEventListener('pagehide', save);
            document.addEventListener('visibilitychange', save);
        }

        /* ===== 起動 ===== */
        (async () => {
            try {
                pcRoot = (await idb.get('pcRoot')) || null;
            }
            catch { }
            document.querySelectorAll('i[data-sv]').forEach(e => e.outerHTML = sv(e.dataset.sv)); /* HTMLに書いたアイコンをSVGにします */
            wire();
            renderAll();
            drTop();
        })();
    </script>
</body>

</html>
