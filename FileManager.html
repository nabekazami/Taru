    <style>
        /* ===== 色(暗い配色が基本。明るい配色は data-theme="light" のとき)
           どちらにするかは、設定の「表示の色」(端末に合わせる / 明るい / 暗い)で決めます ===== */
        :root {
            --bg: #14171c;
            --panel: #1c2129;
            --panel2: #262d38;
            --line: #2f3844;
            --tx: #e6e9ee;
            --tx2: #9aa4b2;
            --acc: #4da3ff;
            --accSoft: rgba(77, 163, 255, .18);
            --star: #f5c518;
            --danger: #ff6b6b;
            --scrim: rgba(0, 0, 0, .5);
            --shadow: 0 6px 24px rgba(0, 0, 0, .45);
            color-scheme: dark;
        }

        :root[data-theme=light] {
            --bg: #f6f7f9;
            --panel: #ffffff;
            --panel2: #eceff4;
            --line: #d9dee5;
            --tx: #1d232b;
            --tx2: #5f6b7a;
            --acc: #1a73e8;
            --accSoft: rgba(26, 115, 232, .12);
            --star: #e6a700;
            --danger: #d93025;
            --scrim: rgba(0, 0, 0, .35);
            --shadow: 0 6px 24px rgba(0, 0, 0, .18);
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        /* SVGアイコン: 大きさは周りの文字の大きさに合わせます */
        .sv {
            display: inline-block;
            width: 1.15em;
            height: 1.15em;
            line-height: 0;
            vertical-align: -.22em;
        }

        .sv svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--tx);
            font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
            font-size: 15px;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }

        body {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        button {
            font: inherit;
            color: inherit;
            background: none;
            border: 0;
            padding: 0;
            cursor: pointer;
            touch-action: manipulation;
        }

        /* ===== 画面全体 ===== */
        #app {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        header {
            display: flex;
            align-items: center;
            gap: 2px;
            min-height: 48px;
            padding: 0 4px;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
        }

        .ib {
            flex: none;
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            font-size: 20px;
        }

        .ib.sm {
            width: 36px;
            height: 36px;
            font-size: 18px;
        }

        .ib:active,
        .tb:active,
        .cr:active,
        .di:active,
        #opbar button:active {
            background: var(--panel2);
        }

        /* ===== タブ ===== */
        #tabs {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 3px;
            height: 48px;
            padding: 0 2px 0 4px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        #tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            flex: none;
            display: flex;
            align-items: center;
            gap: 3px;
            height: 30px;
            padding: 0 7px;
            border: 1px solid transparent;
            border-radius: 8px;
            font-size: 13px;
            background: var(--panel2);
            color: var(--tx2);
            white-space: nowrap;
            cursor: pointer;
        }

        .tab.on {
            padding-right: 2px;
            border-color: var(--acc);
            background: var(--accSoft);
            color: var(--tx);
        }

        .tab .ti {
            flex: none;
        }

        /* Googleドライブのアイコン: 右下にアカウントの頭文字の印(色はアカウントごと)。大きさはアイコンに合わせて変わります */
        .gi {
            position: relative;
            display: inline-block;
            margin-right: .25em; /* 印が後ろの文字に重ならないように */
            line-height: 1;
        }

        .gi .gb {
            position: absolute;
            right: -.3em;
            bottom: -.25em;
            min-width: .72em;
            height: .72em;
            padding: 0 .1em;
            border-radius: .36em;
            color: #fff;
            font-family: system-ui, sans-serif;
            font-size: 1em;
            font-style: normal;
            line-height: .72em;
            text-align: center;
        }

        .gi .gb b {
            display: inline-block;
            font-size: .55em;
            font-weight: 700;
            line-height: inherit;
            vertical-align: top;
            transform: translateY(.03em);
        }

        /* タブの名前は8文字分くらいまで(超えたら「…」)。「Googleドライブ」は切れずに入ります */
        .tab .tl {
            max-width: 8em;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tab .tx {
            flex: none;
            display: grid;
            place-items: center;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            color: var(--tx2);
            font-size: 11px;
        }

        /* ホームのときにタブの欄に出す、アプリのアイコンと名前 */
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-left: 8px;
            font-weight: 700;
            white-space: nowrap;
        }

        .brand .appic {
            width: 26px;
            height: 26px;
        }

        /* ===== 選択中の上部 ===== */
        #selCount {
            flex: 1;
            padding-left: 6px;
            font-weight: 600;
        }

        .tb {
            padding: 9px 14px;
            border-radius: 9px;
            color: var(--acc);
            font-weight: 600;
        }

        /* ===== パス表示 ===== */
        #pathbar {
            display: flex;
            align-items: center;
            gap: 2px;
            min-height: 46px;
            padding: 0 4px;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
        }

        .star {
            color: var(--tx2);
        }

        .star.on {
            color: var(--star);
        }

        /* パス: 先頭(ストレージ名 + ›)は固定し、その後ろのフォルダ部分だけを横にスクロールします */
        #crWrap {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
        }

        #crRoot {
            flex: none;
            display: flex;
            align-items: center;
            max-width: 40vw;
            white-space: nowrap;
        }

        /* 先頭は2行(上にアイコン、下にストレージ名)にして幅を詰めます */
        #crRoot .cr {
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            padding: 3px 5px;
            line-height: 1.15;
        }

        #crRoot .rti {
            font-size: 15px;
        }

        #crRoot .rtn {
            max-width: 100%;
            overflow: hidden;
            font-size: 10.5px;
            text-overflow: ellipsis;
        }

        #crRoot .cr.one {
            flex-direction: row;
            gap: 5px;
            font-size: 13px;
        }

        /* フォルダ部分: 1行に入らなければ2行(下の行に今いるフォルダ側を詰める)。
           2行でも入らなければ、上の行だけを横にスクロール(前のほうから左端でぼかして隠れる) */
        #crumbs {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 46px;
        }

        .crl {
            display: flex;
            align-items: center;
            min-width: 0;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .crl::-webkit-scrollbar {
            display: none;
        }

        #crumbs.two .cr {
            padding: 2px 4px;
        }

        #crL2 {
            overflow: hidden;
            padding-left: 1em; /* 2行目は全角1文字分ずらして、2行目だと分かるようにします */
        }

        #crL2:not(.meas) .cr.last {
            flex: 0 1 auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis; /* フォルダ名1つでも入らないときは末尾を「…」 */
        }

        /* 頭の部分が隠れているときは、左端をぼかします(右へスワイプすると見えます) */
        #crL1.fadeL {
            -webkit-mask-image: linear-gradient(to right, transparent, #000 28px);
            mask-image: linear-gradient(to right, transparent, #000 28px);
        }

        .cr {
            flex: none;
            padding: 7px 4px;
            border-radius: 7px;
            color: var(--tx2);
            font-size: 13px;
        }

        .cr.last {
            color: var(--tx);
            font-weight: 600;
        }

        .cs {
            flex: none;
            color: var(--tx2);
            opacity: .6;
        }

        /* ===== 絞り込み ===== */
        #searchRow {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 4px 6px 10px;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
        }

        #q {
            flex: 1;
            min-width: 0;
            padding: 9px 10px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: var(--bg);
            color: var(--tx);
            font: inherit;
            user-select: text;
            -webkit-user-select: text;
        }

        /* ===== メイン表示領域 ===== */
        #main {
            flex: 1;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .it {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .it .ic {
            flex: none;
            text-align: center;
        }

        .it .tx {
            flex: 1;
            min-width: 0;
        }

        .it .nm {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .it .mt {
            margin-top: 2px;
            color: var(--tx2);
            font-size: 12px;
        }

        .it.hid {
            opacity: .55;
        }

        .it.sel,
        .it.clip {
            background: var(--accSoft);
        }

        /* コピー・移動を押したファイルの印(貼り付けかキャンセルまで、どのタブでも表示) */
        .it .ic {
            position: relative;
        }

        .it .cbm {
            z-index: 1;
            position: absolute;
            left: -5px;
            top: -4px;
            display: grid;
            place-items: center;
            width: 17px;
            height: 17px;
            border-radius: 50%;
            background: var(--acc);
            color: #fff;
            font-size: 10px;
            box-shadow: 0 0 0 2px var(--bg);
        }

        .it.cmove .ic > .sv {
            opacity: .45; /* 移動するもの(ここから無くなるもの)は薄く */
        }

        .ck {
            flex: none;
            display: none;
            place-items: center;
            width: 22px;
            height: 22px;
            border: 2px solid var(--tx2);
            border-radius: 50%;
            font-size: 12px;
        }

        .selmode .ck {
            display: grid;
        }

        .it.sel .ck {
            border-color: var(--acc);
            background: var(--acc);
            color: #fff;
        }

        /* 一覧表示 */
        .list .it {
            gap: 12px;
            min-height: 56px;
            padding: 8px 14px;
            border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
        }

        .list .it .ic {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .list .ck {
            order: 3;
        }

        /* アイコン表示 */
        .grid {
            display: grid;
            /* 1つの幅は92px以上で入るだけ並べる。ただし、幅が足りないスマホでも最低4列にする */
            grid-template-columns: repeat(auto-fill, minmax(min(92px, calc((100% - 18px) / 4)), 1fr));
            gap: 6px;
            padding: 8px;
        }

        .grid .it {
            position: relative;
            flex-direction: column;
            gap: 4px;
            padding: 10px 4px;
            border-radius: 10px;
            text-align: center;
        }

        .grid .it .ic {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        /* ===== サムネイル =====
           写真・動画は、形(縦横の比)のまま枠(一覧 32px・アイコン表示 56px)に収まる大きさで出す。
           大きさは読み込めたときに JS で決める(小さい画像も枠まで広げる)。
           .thw は写真と同じ大きさの入れ物で、枠の真ん中に置く。動画の再生マークは .thw の右下(=絵の右下の角)に付ける */
        .it .thw {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            line-height: 0;
            pointer-events: none;
        }

        .it .th {
            display: block;
            max-width: 32px;
            max-height: 32px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity .15s;
        }

        .grid .it .th {
            max-width: 56px;
            max-height: 56px;
            border-radius: 6px;
        }

        .it .th.apk { /* APKのアイコンは枠いっぱい(もともと正方形) */
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 0;
        }

        .grid .it .th.apk {
            width: 56px;
            height: 56px;
        }

        .it .ic.thok .th {
            opacity: 1;
        }

        .it .ic.thok > .sv {
            visibility: hidden;
        }

        /* 動画の再生マーク(サムネイルが出たときだけ。絵の右下の角に重ねる)
           横長の角丸(上下が半円)の中に ▶。横幅は①-1fの丸と同じで、高さは約3分の2 */
        .it .pl {
            position: absolute;
            right: 1px;
            bottom: 1px;
            display: none;
            width: 16px;
            height: 11px;
            padding: 1.5px 4px;
            border-radius: 6px;
            background: rgba(0, 0, 0, .62);
            line-height: 0;
        }

        .grid .it .pl {
            right: 3px;
            bottom: 3px;
            width: 24px;
            height: 16px;
            padding: 2px 6px;
            border-radius: 8px;
        }

        .gal .it .pl {
            right: 6px;
            bottom: 6px;
            width: 30px;
            height: 20px;
            padding: 3px 8px;
            border-radius: 10px;
        }

        .it .pl svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .it .ic.thok .pl {
            display: block;
        }

        .grid .it .tx {
            width: 100%;
        }

        .grid .it .nm {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            white-space: normal;
            word-break: break-all;
            font-size: 12.5px;
        }

        .grid .it .mt {
            display: none;
        }

        .grid .ck,
        .gal .ck {
            z-index: 3; /* サムネイルより上に */
            position: absolute;
            top: 6px;
            left: 6px;
        }

        /* 写真の上でも見えるように、選んでいない丸にも薄い暗い色を敷く */
        .grid .it:not(.sel) .ck,
        .gal .it:not(.sel) .ck {
            border-color: #fff;
            background: rgba(0, 0, 0, .32);
            box-shadow: 0 0 0 1px rgba(0, 0, 0, .25);
        }

        /* ===== ギャラリー表示 =====
           画像・動画(.media)は名前を出さず、正方形のタイルいっぱいに切り取って並べる(角丸10px・すき間4px)。
           フォルダやほかのファイルは、種類の絵と名前を小さく出す。列の数は 3列 / 4列 / 自動(1枚110px以上) */
        .gal {
            display: grid;
            gap: 4px;
            padding: 4px;
        }

        .gal.gc3 {
            grid-template-columns: repeat(3, 1fr);
        }

        .gal.gc4 {
            grid-template-columns: repeat(4, 1fr);
        }

        .gal.gcauto {
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        }

        .gal .it {
            position: relative;
            aspect-ratio: 1;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            padding: 6px;
            overflow: hidden;
            border-radius: 10px; /* タイルの角を丸める */
            background: var(--panel);
            text-align: center;
        }

        .gal .it .ic {
            font-size: 40px;
        }

        .gal .it .tx {
            width: 100%;
        }

        .gal .it .nm {
            font-size: 11.5px;
        }

        .gal .it .mt {
            display: none;
        }

        .gal .it.media {
            padding: 0;
        }

        .gal .it.media .ic {
            position: absolute;
            inset: 0;
        }

        .gal .it.media .ic > .sv {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .gal .it.media .tx {
            display: none;
        }

        .gal .it .thw {
            inset: 0;
            left: 0;
            top: 0;
            transform: none;
        }

        .gal .it .th {
            width: 100%;
            height: 100%;
            max-width: none;
            max-height: none;
            object-fit: cover;
            border-radius: 0;
        }

        .gal .it .th.apk {
            width: 100%;
            height: 100%;
            padding: 18%;
            object-fit: contain;
        }

        .gal .it .cbm {
            left: auto;
            right: 6px;
            top: 6px;
        }

        /* 選んだタイルは、青い枠と薄い青を重ねる */
        .gal .it.sel::after,
        .gal .it.clip::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 2;
            border: 2px solid var(--acc);
            border-radius: inherit;
            background: color-mix(in srgb, var(--acc) 22%, transparent);
            pointer-events: none;
        }

        .gal .it.clip:not(.sel)::after {
            border-style: dashed;
        }

        /* ===== スクロールのつまみ(長いフォルダでスクロールしたときだけ、右端に出る) ===== */
        #fs {
            position: fixed;
            z-index: 30;
            right: calc(2px + var(--cutR));
            top: 0;
            display: grid;
            place-items: center;
            width: 28px;
            height: 48px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--panel);
            color: var(--tx2);
            box-shadow: var(--shadow);
            opacity: 0;
            visibility: hidden;
            transition: opacity .25s, visibility .25s;
            touch-action: none;
        }

        #fs.on {
            opacity: .95;
            visibility: visible;
        }

        #fs svg {
            width: 16px;
            height: 28px;
        }

        #main.fsing {
            scrollbar-width: none; /* つまみを出している間は、細いスクロールバーを隠す */
        }

        .msg {
            padding: 40px 24px;
            color: var(--tx2);
            line-height: 1.7;
            text-align: center;
        }

        .btn {
            margin-top: 14px;
            padding: 10px 18px;
            border-radius: 10px;
            background: var(--acc);
            color: #fff;
            font-weight: 600;
        }

        /* ===== ホーム(タブを全部閉じたときだけ表示) ===== */
        .home {
            padding: 2px 12px 24px;
        }

        /* 見出し: タップで格納・展開(ドロワーとは別に覚えます) */
        .hsech {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            margin: 6px 0 2px;
            padding: 8px 2px 6px;
            color: var(--tx2);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .05em;
            text-align: left;
        }

        .hsech .ar {
            width: 12px;
        }

        .hcards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(195px, 44vw), 1fr));
            gap: 6px;
        }

        .hgrp {
            display: flex;
            flex-direction: column;
            gap: 6px; /* 並び同士のすき間は、タイル同士のすき間と同じ */
        }

        .hcard {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--panel);
            text-align: left;
        }

        .hcard:active,
        .hfav:active {
            background: var(--panel2);
        }

        .hcard .ic {
            flex: none;
            font-size: 21px;
        }

        .hcard .tx {
            flex: 1;
            min-width: 0;
        }

        .hcard .nm {
            overflow: hidden;
            font-size: 13px;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .hcard .sub {
            overflow: hidden;
            color: var(--tx2);
            font-size: 10.5px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .home .bar {
            height: 3px;
            margin-top: 4px;
        }

        .hfavs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        /* お気に入り: 高さを固定して、2行(Googleドライブ)でも同じ高さにします */
        .hfav {
            display: flex;
            align-items: center;
            gap: 6px;
            max-width: 100%;
            height: 34px;
            padding: 0 10px;
            font-size: 13px;
            border: 1px solid var(--line);
            border-radius: 12px; /* ストレージのタイルと同じ角の丸い四角 */
            background: var(--panel);
        }

        .hfav .fs {
            color: var(--star);
        }

        .hfav .two {
            display: flex;
            flex-direction: column;
            min-width: 0;
            line-height: 1.12;
            text-align: left;
        }

        .hfav .two .nm {
            font-size: 11.5px;
        }

        .hfav .ac {
            overflow: hidden;
            color: var(--tx2);
            font-size: 9.5px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .hfav .nm {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* アプリ版: 許可がないときの案内(ホームの一番上) */
        .hperm {
            margin: 8px 0 4px;
            padding: 12px 14px;
            border: 1px solid var(--acc);
            border-radius: 12px;
            background: var(--accSoft);
            font-size: 13px;
            line-height: 1.6;
        }

        .hperm .btn {
            margin-top: 8px;
            padding: 8px 16px;
        }

        .hnote {
            padding: 4px 2px;
            color: var(--tx2);
            font-size: 13px;
            line-height: 1.6;
        }

        /* ===== 下部操作バー(選択中だけ表示) ===== */
        #opbar {
            display: flex;
            padding: 4px;
            background: var(--panel);
            border-top: 1px solid var(--line);
        }

        /* ボタンは、アイコンと文字のまわりだけが押せる大きさ(区画の真ん中に置きます) */
        #opbar {
            justify-content: space-around;
        }

        #opbar button {
            flex: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            min-width: 56px;
            min-height: 48px;
            padding: 5px 6px;
            border-radius: 10px;
            font-size: 12px;
        }

        /* キャンセルは「何もしないで選択をやめる」ボタンなので、控えめな色 */
        #opbar [data-op=cancel] {
            color: var(--tx2);
        }

        #opbar [data-op=empty] {
            flex-direction: row;
            gap: 8px;
            padding: 8px 16px;
            color: var(--danger);
            font-size: 13px;
            font-weight: 600;
        }

        #opbar .oi {
            font-size: 20px;
        }

        /* 貼り付けバー(コピー・移動を押したあと、貼り付けるまで表示) */
        #clipBar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 6px 6px 14px;
            background: var(--panel);
            border-top: 1px solid var(--line);
            font-size: 13px;
        }

        #clipBar .cbt {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #clipBar .cbt .sv {
            margin-right: 6px;
            color: var(--acc);
        }

        #clipBar .tb {
            padding: 9px 12px;
            font-size: 13px;
        }

        #clipBar .tb.pri {
            background: var(--acc);
            color: #fff;
        }

        /* 進み具合(時間がかかる操作のときだけ表示) */
        /* ===== 進み具合のウインドウ(コピー・移動・削除・ゴミ箱・zip など) =====
           0.3秒以上かかるときだけ、画面の真ん中に出す。出ている間は、後ろの画面は触れない */
        #prog {
            position: fixed;
            inset: 0;
            z-index: 45;
            display: grid;
            place-items: center;
            padding: 16px;
            background: rgba(0, 0, 0, .45);
        }

        #prog[hidden] {
            display: none;
        }

        #prog .pbox {
            width: min(100%, 360px);
            padding: 22px 22px 10px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--panel);
            box-shadow: var(--shadow);
        }

        #progT {
            font-size: 16px;
            font-weight: 700;
        }

        /* 処理中のファイルの名前(左)と量(右) */
        #prog .pn {
            display: flex;
            gap: 10px;
            min-height: 17px;
            margin: 8px 0 14px;
            color: var(--tx2);
            font-size: 12px;
        }

        #progN {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #progS {
            flex: none;
            font-variant-numeric: tabular-nums;
        }

        #prog .pbar {
            position: relative;
            height: 6px;
            border-radius: 3px;
            background: var(--line);
            overflow: hidden;
        }

        #progI {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0;
            border-radius: 3px;
            background: var(--acc);
            transition: width .2s;
        }

        /* 進み具合が分からないときは、棒が左右に流れる */
        #prog .pbar.unk #progI {
            width: 35%;
            transition: none;
            animation: pflow 1.1s ease-in-out infinite;
        }

        @keyframes pflow {
            from {
                left: -35%;
            }

            to {
                left: 100%;
            }
        }

        /* 左に「5 / 7件」、右に「55%」 */
        #prog .pc {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            color: var(--tx2);
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }

        #prog .pbt {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            padding-top: 4px;
        }

        #progX {
            min-width: 120px;
            min-height: 44px;
            padding: 8px 20px;
            border-radius: 10px;
            color: var(--tx);
            font-size: 15px;
            font-weight: 700;
        }

        /* 同じ名前があったときのウインドウ */
        .cf {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-top: 10px;
        }

        .cf label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 6px;
            border-radius: 8px;
            color: var(--tx);
            cursor: pointer;
        }

        .cf label small {
            display: block;
            color: var(--tx2);
            font-size: 11.5px;
        }

        .dlg .cf input {
            flex: none;
            width: 18px;
            height: 18px;
            margin: 0;
            padding: 0;
            accent-color: var(--acc);
        }

        .cfall {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            color: var(--tx2);
            font-size: 13px;
        }

        .dlg .cfall input {
            flex: none;
            width: 16px;
            height: 16px;
            margin: 0;
            padding: 0;
            accent-color: var(--acc);
        }

        .dlg .err {
            margin-top: 6px;
            color: var(--danger);
            font-size: 12.5px;
        }

        #opbar button:disabled {
            opacity: .35;
        }

        /* ===== ドロワー(パス表示の下から出てきます) ===== */
        #scrim {
            position: fixed;
            top: var(--drTop, 94px);
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 20;
            background: var(--scrim);
        }

        #drawer {
            position: fixed;
            top: var(--drTop, 94px);
            bottom: 0;
            left: 0;
            z-index: 21;
            display: flex;
            flex-direction: column;
            width: min(70vw, 250px); /* 一番長いアカウント名(英字13文字 + .)が1行に入る幅 */
            background: var(--panel);
            box-shadow: var(--shadow);
            transform: translateX(-104%);
            transition: transform .22s ease;
            padding-bottom: env(safe-area-inset-bottom);
        }

        #drawer.open {
            transform: none;
        }

        .dscroll {
            flex: 1;
            overflow-y: auto;
        }

        .sec {
            border-radius: 10px;
        }

        .sech {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            padding: 10px 10px 5px;
            color: var(--tx2);
            font-size: 12px; /* ドロワー・メニューの文字はホーム画面と同じ大きさ */
            font-weight: 700;
            letter-spacing: .05em;
            text-align: left;
        }

        .sech .ar {
            width: 14px;
        }

        .lift {
            position: relative;
            z-index: 2;
            background: var(--panel2);
            box-shadow: var(--shadow);
        }

        .di {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 40px; /* 1行の項目は約40px、2行の項目は約44px(押し間違えない程度に詰めています) */
            padding: 4px 12px 4px 10px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
        }

        .di .ic {
            flex: none;
            width: 26px;
            font-size: 20px;
            text-align: center;
        }

        .di .tx {
            flex: 1;
            min-width: 0;
        }

        .di .nm {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 2行目: 上下に少しすき間を足して、Googleドライブの頭文字の印が切れないようにします */
        .di .sub {
            overflow: hidden;
            padding: 1px 0 2px;
            color: var(--tx2);
            font-size: 10.5px;
            line-height: 1.25;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Googleドライブのアカウント名(名前の後ろに並べます。大きさと色は2行目と同じ) */
        .di .acn {
            color: var(--tx2);
            font-size: 10.5px;
        }

        .di.cur {
            background: var(--accSoft);
        }

        .di .fs {
            color: var(--star);
        }

        .bar {
            height: 4px;
            margin-top: 5px;
            overflow: hidden;
            border-radius: 2px;
            background: var(--panel2);
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--acc);
        }

        .dnote {
            padding: 6px 12px 10px 46px;
            color: var(--tx2);
            font-size: 12px;
            line-height: 1.6;
        }

        .dsep {
            height: 1px;
            margin: 4px 0;
            background: var(--line);
        }

        .appic {
            flex: none;
            width: 22px;
            height: 22px;
        }

        .dlg .bd .appic {
            vertical-align: -5px;
            margin-right: 6px;
        }

        .setv .appic {
            vertical-align: -5px;
            margin-right: 6px;
        }

        /* ===== 設定の画面 ===== */
        .seth {
            margin: 14px 0 6px;
            color: var(--tx2);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .05em;
        }

        .dlg .bd .seth:first-child {
            margin-top: 0;
        }

        /* 表示の色: 3つ並びのボタン(選んでいるものを青く) */
        .seg {
            display: flex;
            gap: 6px;
        }

        .seg button {
            flex: 1;
            min-height: 40px;
            padding: 6px 4px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--bg);
            color: var(--tx);
            font-size: 13px;
        }

        /* アプリ内のアイコン: 3つの絵を並べてタップで選ぶ */
        .icsel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .icsel button {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 4px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--bg);
            color: var(--tx);
            font-size: 11.5px;
        }

        .icsel img {
            width: 56px;
            height: 56px;
        }

        .seg button.on,
        .icsel button.on {
            border-color: var(--acc);
            background: var(--accSoft);
            font-weight: 700;
        }

        .setv {
            margin-top: 16px;
            font-size: 12.5px;
        }

        .dlg h3 .appic {
            width: 26px;
            height: 26px;
            vertical-align: -6px;
            margin-right: 4px;
        }

        .ver {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px 12px 10px;
            color: var(--tx2);
            font-size: 11px;
        }

        /* ===== メニュー・ウインドウ・お知らせ ===== */
        #pop {
            position: fixed;
            inset: 0;
            z-index: 40;
        }

        .pm {
            position: fixed;
            min-width: 190px;
            max-width: 84vw;
            max-height: 80vh;
            overflow: auto;
            padding: 6px 0;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--panel);
            box-shadow: var(--shadow);
        }

        .pm button {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 11px 16px;
            font-size: 13px;
            text-align: left;
        }

        .pm button:active {
            background: var(--panel2);
        }

        .pm button:disabled {
            opacity: .4;
        }

        .pm .pc {
            width: 20px;
            color: var(--acc);
            font-size: 14.5px;
            text-align: center;
        }

        /* メニューの中の横並びのボタン(ギャラリー表示の列の数) */
        .pmrow {
            display: flex;
            gap: 6px;
            padding: 2px 12px 8px 46px;
        }

        .pmrow button {
            flex: 1;
            justify-content: center;
            padding: 7px 4px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 12.5px;
            text-align: center;
        }

        .pmrow button.on {
            border-color: var(--acc);
            background: var(--accSoft);
            color: var(--acc);
            font-weight: 700;
        }

        .pm hr {
            margin: 4px 0;
            border: 0;
            border-top: 1px solid var(--line);
        }

        #modal {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: grid;
            place-items: center;
            padding: 16px;
            background: var(--scrim);
        }

        /* 下から出てくる選択画面(削除するとき) */
        #modal.sheetm {
            place-items: end center;
            padding: 0;
        }

        .sheet {
            width: min(100vw, 480px);
            padding: 16px 16px calc(18px + env(safe-area-inset-bottom));
            border-radius: 16px 16px 0 0;
            background: var(--panel);
            box-shadow: var(--shadow);
            animation: sheetUp .18s ease-out;
        }

        @keyframes sheetUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
        }

        .sheet .sh {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 14px;
        }

        .sheet .sh h3 {
            flex: 1;
            min-width: 0;
            margin: 6px 0 0 4px;
            font-size: 15px;
            word-break: break-all;
        }

        .sheet .why {
            margin: -6px 4px 12px;
            color: var(--tx2);
            font-size: 12.5px;
        }

        .sheet .sb {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 8px;
            padding: 13px;
            border-radius: 12px;
            background: var(--acc);
            color: #fff;
            font-weight: 700;
        }

        .sheet .sb.danger {
            background: var(--danger);
        }

        .sheet .sb.sec {
            background: var(--panel2);
            color: var(--tx);
        }

        .sheet .note {
            margin-top: 6px;
            color: var(--tx2);
            font-size: 11.5px;
            text-align: center;
        }

        /* 「完全に削除すると元に戻せません」は、ゴミ箱を空にするボタンと同じ赤い文字 */
        .sheet .note.warn {
            color: var(--danger);
            font-weight: 600;
        }

        .dlg {
            width: min(92vw, 400px);
            max-height: 100%; /* 横画面などで背が足りないときは、ウインドウの中をスクロール */
            overflow-y: auto;
            padding: 18px;
            border-radius: 14px;
            background: var(--panel);
            box-shadow: var(--shadow);
        }

        .dlg h3 {
            margin: 0 0 10px;
            font-size: 16px;
        }

        .dlg .bd {
            color: var(--tx2);
            font-size: 14px;
            line-height: 1.6;
            word-break: break-all;
            /* ウインドウの中の文字も選べないようにする(長押しで「コピー / すべて選択」が出ないように)。
               入力欄(input)だけは選べる */
        }

        .dlg input {
            width: 100%;
            margin-top: 6px;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--bg);
            color: var(--tx);
            font: inherit;
            user-select: text;
            -webkit-user-select: text;
        }

        .dlg .bt {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }

        .dlg .bt button {
            padding: 9px 16px;
            border-radius: 9px;
        }

        .dlg .ok {
            background: var(--acc);
            color: #fff;
            font-weight: 600;
        }

        .dlg .ok.danger {
            background: var(--danger);
        }

        .prop {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 6px 14px;
            margin: 0;
            font-size: 13.5px;
        }

        .prop dt {
            color: var(--tx2);
        }

        .prop dd {
            margin: 0;
            color: var(--tx);
        }

        code {
            color: var(--tx);
            font-size: 13px;
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: calc(84px + env(safe-area-inset-bottom));
            z-index: 60;
            width: max-content; /* 画面の半分で折り返さないように */
            max-width: 88vw;
            padding: 10px 16px;
            border-radius: 10px;
            background: #333c48;
            color: #fff;
            font-size: 13.5px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) translateY(20px);
            transition: .2s;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%);
        }

        /* 「元に戻す」付きのお知らせ */
        #toast.act {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 6px 6px 6px 16px;
            text-align: left;
        }

        #toast.act.show {
            pointer-events: auto;
        }

        #toast .ta {
            flex: none;
            padding: 8px 12px;
            border-radius: 8px;
            color: #8cc4ff;
            font-weight: 700;
        }

        /* ===== アプリ版の横画面: カメラの穴の分(--cutL / --cutR)だけ、中身を内側に置きます
           背景の色は端まで広げたまま(Kotlinが window.taruInsets で幅を伝えます。ふだんは0) ===== */
        :root {
            --cutL: 0px;
            --cutR: 0px;
        }

        header,
        #pathbar {
            padding-left: calc(4px + var(--cutL));
            padding-right: calc(4px + var(--cutR));
        }

        #searchRow {
            padding-left: calc(10px + var(--cutL));
            padding-right: calc(4px + var(--cutR));
        }

        #main {
            padding-left: var(--cutL);
            padding-right: var(--cutR);
        }

        #opbar {
            padding-left: calc(4px + var(--cutL));
            padding-right: calc(4px + var(--cutR));
        }

        #clipBar {
            padding-left: calc(14px + var(--cutL));
            padding-right: calc(6px + var(--cutR));
        }

        #drawer {
            padding-left: var(--cutL);
            width: calc(min(70vw, 250px) + var(--cutL));
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- 上部: タブ / 検索 / メニュー -->
        <header id="top">
            <div id="tabs"></div>
            <button id="bMore" class="ib" aria-label="メニュー"><i data-sv="more"></i></button>
        </header>
        <!-- 選択中の上部 -->
        <header id="selTop" hidden>
            <button id="selX" class="ib" aria-label="選択をやめる"><i data-sv="close"></i></button>
            <span id="selCount"></span>
            <button id="selAll" class="tb">全選択</button>
        </header>
        <!-- ドロワーのボタン / お気に入り登録 / パス表示 -->
        <div id="pathbar">
            <button id="bMenu" class="ib" aria-label="ドロワー"><i data-sv="menu"></i></button>
            <div id="crWrap">
                <div id="crRoot"></div>
                <div id="crumbs">
                    <div class="crl" id="crL1"></div>
                    <div class="crl" id="crL2" hidden></div>
                </div>
            </div>
            <button id="bStar" class="ib star" aria-label="お気に入り"><i data-sv="star"></i></button>
        </div>
        <div id="searchRow" hidden>
            <input id="q" placeholder="このフォルダ内を名前で絞り込み" autocomplete="off">
            <button id="qX" class="ib sm" aria-label="絞り込みを閉じる"><i data-sv="close"></i></button>
        </div>
        <!-- ファイル・フォルダの一覧 -->
        <main id="main"></main>
        <!-- 下部操作バー -->
        <footer id="opbar" hidden>
            <button data-op="copy"><span class="oi"><i data-sv="copy"></i></span>コピー</button>
            <button data-op="move"><span class="oi"><i data-sv="move"></i></span>移動</button>
            <button data-op="del"><span class="oi"><i data-sv="del"></i></span>削除</button>
            <button data-op="restore" hidden><span class="oi"><i data-sv="openHere"></i></span>元に戻す</button>
            <button data-op="purge" hidden><span class="oi"><i data-sv="del"></i></span>完全に削除</button>
            <button data-op="empty" hidden><span class="oi"><i data-sv="del"></i></span>ゴミ箱を空にする</button>
            <button data-op="ren" id="opRen"><span class="oi"><i data-sv="ren"></i></span>名前変更</button>
            <button data-op="more"><span class="oi"><i data-sv="moreH"></i></span>その他</button>
            <button data-op="cancel"><span class="oi"><i data-sv="close"></i></span>キャンセル</button>
        </footer>
        <!-- 貼り付けバー -->
        <footer id="clipBar" hidden>
            <span class="cbt" id="cbText"></span>
            <button class="tb" id="cbX">キャンセル</button>
            <button class="tb pri" id="cbPaste">ここに貼り付け</button>
        </footer>
    </div>

    <div id="scrim" hidden></div>
    <nav id="drawer" aria-label="ドロワー">
        <div class="dscroll">
            <div id="secs"></div>
            <div class="dsep"></div>
            <div class="di" id="dTrash"><span class="ic"><i data-sv="del"></i></span>
                <div class="tx">
                    <div class="nm">ゴミ箱</div>
                    <div class="sub" id="dTrashSub"></div>
                </div>
            </div>
            <div class="di" id="dSet"><span class="ic"><i data-sv="gear"></i></span>
                <div class="tx">設定</div>
            </div>
        </div>
        <div class="ver" id="ver"></div>
    </nav>
    <div id="pop" hidden></div>
    <div id="modal" hidden></div>
    <div id="prog" hidden>
        <div class="pbox" role="dialog" aria-live="polite">
            <div id="progT"></div>
            <div class="pn"><span id="progN"></span><span id="progS"></span></div>
            <div class="pbar" id="progBar"><i id="progI"></i></div>
            <div class="pc"><span id="progC"></span><span id="progP"></span></div>
            <div class="pbt"><button id="progX">キャンセル</button></div>
        </div>
    </div>
    <div id="toast"></div>

    <script>
        'use strict';
        /* =====================================================================
           たるファイラー(HTML版・段階①: 画面の骨組み)
           ・ストレージごとの読み書きは「listDir」などにまとめてあります。
             Androidアプリ版では、ここを Kotlin 側の処理に差し替えます。
           ・HTML版では、内部ストレージ・SDカード・さくら・Googleドライブはダミーのデータです。
             「PCフォルダ」だけは、PCのChromeで選んだ本物のフォルダを表示します(HTML版のテスト用)。
           ===================================================================== */
        const APP_VER = '2026-11-14e';
        /* アプリ版(Android)の中で開いたときだけ、Kotlin側の窓口 window.TaruApp があります */
        const APP = window.TaruApp || null;
        const APPVER = APP ? (() => {
            try {
                return APP.appVersion();
            }
            catch {
                return '';
            }
        })() : '';
        const KEY = 'taruFiler.v1';
        const $ = id => document.getElementById(id);
        const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const uid = () => Math.random().toString(36).slice(2, 10);
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const pad = n => String(n).padStart(2, '0');
        /* 長押しのフィードバック(振動)。長押しして並べ替えるところ(ドロワーの見出し・お気に入り)で使います。
           設定の「長押しのフィードバック」が「なし」のときは何もしません。
           アプリ版は Kotlin 側で振動させます(端末の「タッチ時の振動」の設定に関係なく振動します) */
        const vib = () => {
            if (S.lpFb == 'none')
                return;
            try {
                if (APP && APP.vibrate)
                    APP.vibrate(30);
                else if (navigator.vibrate)
                    navigator.vibrate(25);
            }
            catch { }
        };
        const SOON = 'この操作は、これからの段階で使えるようになります';
        const APPONLY = APP ? 'これからの段階で使えるようになります' : 'Androidアプリ版で使えるようになります';
        /* アプリ版で、まだ作っていない操作(押したらお知らせだけ出して止めます) */
        function notYet(stage) {
            if (!APP)
                return false;
            toast(`この操作は、${stage}で使えるようになります`);
            return true;
        }

        /* ===== アイコン(SVG)。見本: FileManager_icons.html。ストレージとファイルは A(色付き)、ボタンは B(線) ===== */
        const L = (inner, sw = 1.7) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
        const F = inner => `<svg viewBox="0 0 24 24">${inner}</svg>`;
        const DOC_P = 'M6.5 2.5h7l5 5v12a2 2 0 0 1-2 2h-10a2 2 0 0 1-2-2v-15a2 2 0 0 1 2-2z';
        const docB = extra => L(`<path d="${DOC_P}"/><path d="M13.5 2.5v5h5"/>${extra}`);
        const docA = (extra, band) => F(`<path d="M6 2h8l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#eef2f7" stroke="#aab6c6" stroke-width=".8"/><path d="M14 2v5h5z" fill="#c3cddb"/>${band ? `<path d="M4 15h15v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" fill="${band}"/>` : ''}${extra}`);
        const gear = (() => {
            const pts = [];
            for (let i = 0; i < 8; i++) {
                const a0 = i * Math.PI / 4;
                for (const [da, r] of [[-0.24, 7.8], [-0.14, 9.5], [0.14, 9.5], [0.24, 7.8]])
                    pts.push([12 + r * Math.cos(a0 + da), 12 + r * Math.sin(a0 + da)]);
            }
            return 'M' + pts.map(p => p.map(v => v.toFixed(2)).join(' ')).join('L') + 'z';
        })();
        const STAR = 'M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-2.9-5.4 2.9 1.1-6-4.5-4.2 6.1-.8z';
        const FOLDER_B = 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z';

        /* ===== アイコン(A: 色付き / B: 線) ===== */
        const STORAGE = [
            ['内部ストレージ',
                F('<rect x="6" y="1.8" width="12" height="20.4" rx="2.6" fill="#4b5b70"/><rect x="7.4" y="4.2" width="9.2" height="13.8" rx="1" fill="#7cc4ff"/><path d="M7.4 4.2h9.2v4L7.4 14z" fill="#a8d8ff" opacity=".6"/><rect x="10.3" y="19.4" width="3.4" height="1.2" rx=".6" fill="#c9d3df"/>'),

        /* Kotlin側に頼む(時間がかかる処理)。終わると Kotlin が window.__taruCb を呼びます */
        const appCbs = new Map();

        const SORT_DEF = { k: 'name', asc: true }, SORT_MAX = 500;

        const sortKey = t => t.st + ':' + (t.st == 'trash' ? '' : t.p.join('/'));

           どのお気に入りから開いたか(t.fav)は別に覚えているので、ドロワーのお気に入りを押すと登録した場所に戻ります */
        const tabName = t => {

        /* ===== 小さな保存箱(PCフォルダの接続情報を覚えておくため) ===== */
        const idb = (() => {
            let pr;
            const open = () => pr || (pr = new Promise((res, rej) => {
                const r = indexedDB.open('taruFiler', 1);
                r.onupgradeneeded = () => r.result.createObjectStore('kv');
                r.onsuccess = () => res(r.result);
                r.onerror = () => rej(r.error);

            const tx = async (mode, fn) => {
                const db = await open();
                return new Promise((res, rej) => {
                    const t = db.transaction('kv', mode);
                    const q = fn(t.objectStore('kv'));
                    t.oncomplete = () => res(q && q.result);
                    t.onerror = () => rej(t.error);
                });
            };
            return {
                get: k => tx('readonly', s => s.get(k)),
                set: (k, v) => tx('readwrite', s => s.put(v, k)),

        /* ===== ストレージの読み込み(アプリ版ではここを差し替えます) ===== */
        let pcRoot = null;
        async function pcDir(p) {
            let h = pcRoot;
            for (const n of p)
                h = await h.getDirectoryHandle(n);
            return h;
        }
        async function listPc(p) {
            if (!pcRoot)
                throw { code: 'pcnone' };
            if (await pcRoot.queryPermission({ mode: 'readwrite' }) != 'granted')
                throw { code: 'pcperm' };
            let h;
            try {
                h = await pcDir(p);
            }
            catch {
                throw { code: 'notfound' };
            }
            const jobs = [];
            for await (const [name, e] of h.entries()) {
                if (e.kind == 'directory')
                    jobs.push(Promise.resolve({ name, dir: true, size: null, mtime: null }));
                else
                    jobs.push(e.getFile().then(f => ({ name, dir: false, size: f.size, mtime: f.lastModified }), () => ({ name, dir: false, size: null, mtime: null })));
            }
            return Promise.all(jobs);
        }
        const TRASH = '.TaruTrash';
        async function listDir(st, p) {
            if (st.kind == 'trash')
                return listTrash();
            const a = await listDir0(st, p);
            return p.length ? a : a.filter(x => x.name != TRASH); /* ゴミ箱の隠しフォルダは、隠しファイルを表示しても出しません */
        }
        async function listDir0(st, p) {
            if (st.kind == 'pc')
                return listPc(p);
            if (APP && st.kind == 'local') {
                if (st.missing)
                    throw { code: 'nosd' };
                const r = await appCall('list', { path: [st.real, ...p].join('/') });
                return r.map(x => ({ name: x.name, dir: !!x.dir, size: x.dir ? null : x.size, mtime: x.mtime || null }));
            }
            if (st.kind == 'server' || st.kind == 'gdrive')
                await sleep(220); /* ネット越しの読み込みの雰囲気を出すため、少し待ちます */
            let n = st.demo;
            for (const s of p) {
                n = n.c[s];
                if (!n || !n.dir)
                    throw { code: 'notfound' };
            }
            return Object.entries(n.c).map(([name, v]) => ({ name, dir: v.dir, size: v.dir ? null : v.size, mtime: v.mtime }));
        }
        function realPath(st, p) {
            const base = st.kind == 'pc' ? (pcRoot ? pcRoot.name : 'PCフォルダ') : st.real;
            return [base, ...p].join('/');
        }

        /* ===== ファイル操作の部品(アプリ版ではここを Kotlin 側の処理に差し替えます) =====
           PCフォルダ: 本物のファイルを操作します / ダミー: ブラウザの中だけで変更します(再読み込みで元に戻ります) */
        const isPc = st => st.kind == 'pc';
        /* アプリ版の内部ストレージ・SDカードは、Kotlin(FileOps.kt)で本物のファイルを操作します */
        const isReal = st => !!APP && st.kind == 'local';
        const ap = (st, p, name) => [st.real, ...p, ...(name != null ? [name] : [])].join('/');
        function demoDir(st, p) {
            let n = st.demo;
            for (const s of p) {
                n = n.c[s];
                if (!n || !n.dir)
                    throw { code: 'notfound' };
            }
            return n;
        }
        /* 名前があるか(あれば {dir}、なければ null) */
        async function fsGet(st, p, name) {
            if (isReal(st)) {
                const v = await appCall('stat', { path: ap(st, p, name) });
                return v ? { dir: !!v.dir, size: v.size || 0 } : null;
            }
            if (!isPc(st)) {
                const n = demoDir(st, p).c[name];
                return n ? { dir: !!n.dir } : null;
            }
            const d = await pcDir(p);
            try {
                await d.getFileHandle(name);
                return { dir: false };
            }
            catch { }
            try {
                await d.getDirectoryHandle(name);
                return { dir: true };
            }
            catch { }
            return null;
        }
        async function fsList(st, p) {
            if (isReal(st))
                return (await appCall('list', { path: ap(st, p) })).map(x => ({ name: x.name, dir: !!x.dir }));
            if (!isPc(st))
                return Object.entries(demoDir(st, p).c).map(([name, v]) => ({ name, dir: !!v.dir }));
            const a = [];
            for await (const [name, e] of (await pcDir(p)).entries())
                a.push({ name, dir: e.kind == 'directory' });
            return a;
        }
        async function fsMkdir(st, p, name) {
            if (isReal(st)) {
                await appCall('mkdir', { path: ap(st, p, name) });
                return;
            }
            if (!isPc(st)) {
                demoDir(st, p).c[name] = { dir: true, mtime: Date.now(), c: {} };
                return;
            }
            await (await pcDir(p)).getDirectoryHandle(name, { create: true });
        }
        async function fsRemove(st, p, name) {
            if (isReal(st)) {
                await appCall('remove', { path: ap(st, p, name) });
                return;
            }
            if (!isPc(st)) {
                delete demoDir(st, p).c[name];
                return;
            }
            await (await pcDir(p)).removeEntry(name, { recursive: true });
        }
        async function fsCopyFile(src, sp, name, dst, dp, dn, j) {
            if (isReal(src) && isReal(dst)) {
                try {
                    const n = await appCall('copy', { src: ap(src, sp, name), dst: ap(dst, dp, dn), job: j ? j.id : 0 });
                    if (j) {
                        j.bDone += n || 0;
                        j.bCur = 0;
                    }
                }
                catch (e) {
                    if (e && e.code == 'canceled' && j) {
                        j.cancel = true; /* 中止のときは、作りかけのファイルは Kotlin 側で消してあります */
                        return;
                    }
                    throw e;
                }
                return;
            }
            if (!isPc(src)) {
                const n = demoDir(src, sp).c[name];
                demoDir(dst, dp).c[dn] = { dir: false, size: n.size, mtime: n.mtime };
                return;
            }
            const f = await (await (await pcDir(sp)).getFileHandle(name)).getFile();
            const h = await (await pcDir(dp)).getFileHandle(dn, { create: true });
            const w = await h.createWritable();
            await w.write(f);
            await w.close();
        }
        /* 同じストレージの中で、中身をコピーせずに移動(名前変更)します。できなければ false */
        async function fsMoveFast(st, sp, name, dp, dn) {
            if (isReal(st))
                return !!(await appCall('move', { src: ap(st, sp, name), dst: ap(st, dp, dn) }));
            if (!isPc(st)) {
                const s = demoDir(st, sp), d = demoDir(st, dp), n = s.c[name];
                delete s.c[name];
                d.c[dn] = n;
                return true;
            }
            try {
                const dir = await pcDir(sp);
                const h = await dir.getFileHandle(name).catch(() => dir.getDirectoryHandle(name));
                if (!h.move)
                    return false;
                if (samePath(sp, dp))
                    await h.move(dn);
                else
                    await h.move(await pcDir(dp), dn);
                return true;
            }
            catch {
                return false;
            }
        }
        /* 「名前 (2).txt」のように、空いている名前を探します */
        async function uniqName(st, p, name, isDir) {

            for (let i = 2; ; i++) {
                const n = `${base} (${i})${ex}`;
                if (!(await fsGet(st, p, n)))
                    return n;
            }
        }
        /* 名前のチェック(問題があれば理由を返します) */
        function badName(v) {
            if (!v)
                return '名前を入力してください';
            if (/[\\/:*?"<>|]/.test(v))
                return '使えない文字が入っています( \\ / : * ? " < > | )';
            if (v == '.' || v == '..')

        /* ===== 表示用の小物 ===== */
        const ext = n => {
            const i = n.lastIndexOf('.');
            return i > 0 ? n.slice(i + 1).toLowerCase() : '';
        };
        const TYPES = [
            [sv('image'), '画像', /^(jpe?g|png|gif|webp|bmp|heic|svg|ico)$/],
            [sv('video'), '動画', /^(mp4|mov|mkv|avi|webm|3gp)$/],
            [sv('music'), '音楽', /^(mp3|m4a|aac|flac|wav|ogg)$/],
            [sv('pdf'), 'PDF', /^pdf$/],
            [sv('zip'), '圧縮ファイル', /^(zip|rar|7z|gz|tar)$/],
            [sv('apk'), 'アプリ(APK)', /^apk$/],
            [sv('doc'), '文書', /^(docx?|odt|rtf)$/],
            [sv('sheet'), '表計算', /^(xlsx?|csv|ods)$/],

        function ftype(n) {

        function fmtSize(b) {
            if (b == null)
                return '—';
            /* 1 KB = 1000 B で計算します(Androidの設定画面と同じ) */
            const u = ['B', 'KB', 'MB', 'GB', 'TB'];
            let i = 0;
            while (b >= 1000 && i < 4) {
                b /= 1000;
                i++;
            }
            if (i < 4 && Math.round(b) >= 1000) { /* 999.6 KB が「1000 KB」にならないように */
                b /= 1000;
                i++;
            }
            return (i && b < 100 ? b.toFixed(1) : Math.round(b)) + ' ' + u[i];
        }
        function fmtDate(t) {
            if (!t)
                return '';

        }
        const COL = new Intl.Collator('ja', { numeric: true, sensitivity: 'base' });

        let toastT;
        /* お知らせ。opt = { act: 'ボタンの文字', fn: 押したときの処理 } を渡すと、ボタン付きで少し長く表示します */
        function toast(s, opt) {

            if (opt)

        }

        /* 長押しのあとに続く「クリック」を1回だけ無視します(長押しで開いたメニューを誤って押さないため) */
        let suppress = false;
        document.addEventListener('pointerdown', () => suppress = false, true);
        document.addEventListener('click', e => {
            if (suppress) {
                suppress = false;
                e.stopPropagation();
                e.preventDefault();
            }

        /* タップ(tap)と長押し(long)。PCでは右クリックも長押しと同じ扱いです */
        function pressable(box, sel, { tap, long }) {
            let st = null;
            box.addEventListener('pointerdown', e => {
                const it = e.target.closest(sel);
                if (!it || !box.contains(it) || e.button > 0)
                    return;
                st = { it, x: e.clientX, y: e.clientY, id: e.pointerId };
                st.t = setTimeout(() => {
                    if (!st || st.done)
                        return;
                    st.done = true;
                    suppress = true;
                    long(st.it, st.x, st.y);
                }, 480);
            });
            box.addEventListener('pointermove', e => {
                if (st && e.pointerId == st.id && Math.hypot(e.clientX - st.x, e.clientY - st.y) > 10) {
                    clearTimeout(st.t);
                    st = null;
                }
            });
            const end = () => {
                if (st)
                    clearTimeout(st.t);
                st = null;
            };
            box.addEventListener('pointerup', end);
            box.addEventListener('pointercancel', end);
            box.addEventListener('contextmenu', e => {
                const it = e.target.closest(sel);
                if (!it || !box.contains(it))
                    return;
                e.preventDefault();
                if (st && st.done)
                    return;
                if (st) {
                    clearTimeout(st.t);
                    st.done = true;
                }
                suppress = true;
                long(it, e.clientX, e.clientY);
            });
            if (tap)
                box.addEventListener('click', e => {
                    const it = e.target.closest(sel);
                    if (it && box.contains(it))
                        tap(it, e);
                });
        }

        /* 長押しして動かすと並べ替え(drop)、動かさずに離すとメニュー(menu)、ふつうのタップは tap */
        function sortable(box, sel, { tap, menu, drop }) {
            let st = null;
            box.addEventListener('pointerdown', e => {
                const h = e.target.closest(sel.h);
                if (!h || !box.contains(h) || e.button > 0)
                    return;
                st = { h, it: h.closest(sel.it), x: e.clientX, y: e.clientY, id: e.pointerId };
                st.t = setTimeout(() => {
                    if (!st)
                        return;
                    st.armed = true;
                    suppress = true;
                    vib();
                    st.it.classList.add('lift');
                }, 450);
            });
            window.addEventListener('pointermove', e => {
                if (!st || e.pointerId != st.id)
                    return;

                if (!st.armed) {
                    if (d > 10) {
                        clearTimeout(st.t);
                        st = null;
                    }
                    return;
                }
                if (d > 6)
                    st.drag = true;
                if (st.drag)
                    place(st.it, e.clientY, sel.it);
            });
            window.addEventListener('pointerup', e => {
                if (!st || e.pointerId != st.id)
                    return;
                clearTimeout(st.t);
                const s = st;
                st = null;
                s.it.classList.remove('lift');
                if (s.drag)
                    drop();
                else if (s.armed && menu)
                    menu(s.it, e.clientX, e.clientY);
            });
            window.addEventListener('pointercancel', () => {
                if (!st)
                    return;
                clearTimeout(st.t);
                st.it.classList.remove('lift');
                if (st.drag)
                    drop();
                st = null;
            });
            document.addEventListener('touchmove', e => {
                if (st && st.armed)
                    e.preventDefault(); /* 並べ替え中は画面がスクロールしないようにします */
            }, { passive: false });
            box.addEventListener('contextmenu', e => {
                const h = e.target.closest(sel.h);
                if (!h || !box.contains(h))
                    return;
                e.preventDefault();
                if (st || !menu)
                    return;
                suppress = true;
                menu(h.closest(sel.it), e.clientX, e.clientY);
            });
            if (tap)
                box.addEventListener('click', e => {
                    const h = e.target.closest(sel.h);
                    if (h && box.contains(h))
                        tap(h.closest(sel.it), e);
                });
        }
        /* 並べ替え中: 指の位置に合わせて、離す前に並びを入れ替えて見せます */
        function place(it, y, isel) {
            const par = it.parentNode;
            const sibs = [...par.children].filter(c => c !== it && c.matches(isel));
            const before = sibs.find(c => {
                const r = c.getBoundingClientRect();
                return y < r.top + r.height / 2;
            });
            if (before) {
                if (it.nextElementSibling !== before)
                    par.insertBefore(it, before);
            }
            else if (sibs.length) {
                const last = sibs[sibs.length - 1];
                if (last.nextElementSibling !== it)
                    last.after(it);
            }
        }

        /* ===== メニュー(︙・長押し) ===== */
        /* up: 指定位置の上側に出します。x に { center: 中心のx } を渡すと、その位置を中心にして出します */
        function popMenu(x, y, list, up = false) {
            const pop = $('pop');
            pop.innerHTML = '<div class="pm">' + list.map((m, i) => m == '-' ? '<hr>'
                : m.row ? `<div class="pmrow">${m.row.map((b, j) => `<button data-i="${i}" data-j="${j}" class="${b.on ? 'on' : ''}">${esc(b.t)}</button>`).join('')}</div>`
                : `<button data-i="${i}"${m.dis ? ' disabled' : ''}><span class="pc">${m.chk ? sv('check') : (m.ic ? sv(m.ic) : '')}</span>${esc(m.t)}</button>`).join('') + '</div>';
            pop.hidden = false;
            const pm = pop.firstChild, r = pm.getBoundingClientRect();
            const left = typeof x == 'object' ? x.center - r.width / 2 : x;
            pm.style.left = Math.max(8, Math.min(left, innerWidth - r.width - 8)) + 'px'; /* 画面からはみ出すときだけ端に寄せます */
            pm.style.top = Math.max(8, Math.min(up ? y - r.height : y, innerHeight - r.height - 8)) + 'px';
            pop.onclick = e => {
                const b = e.target.closest('button[data-i]');
                if (e.target === pop || b)
                    pop.hidden = true;
                if (b)
                    b.dataset.j != null ? list[+b.dataset.i].row[+b.dataset.j].act() : list[+b.dataset.i].act();
            };
        }

        /* ===== ウインドウ(確認・入力・情報) ===== */
        let closeModal = null;
        function dialog({ title, icon = '', html = '', input = null, ok = 'OK', cancel = 'キャンセル', danger = false }) {
            return new Promise(res => {
                const m = $('modal');
                $('toast').classList.remove('show');
                m.innerHTML = `<div class="dlg" role="dialog"><h3>${icon ? sv(icon) + ' ' : ''}${esc(title)}</h3><div class="bd">${html}</div>`
                    + (input != null ? `<input id="dlgIn" value="${esc(input)}">` : '')
                    + `<div class="bt">${cancel ? `<button data-r="0">${esc(cancel)}</button>` : ''}<button data-r="1" class="ok${danger ? ' danger' : ''}">${esc(ok)}</button></div></div>`;
                m.hidden = false;
                const inp = $('dlgIn');
                const done = r => {
                    m.hidden = true;
                    m.innerHTML = '';
                    closeModal = null;
                    res(r ? (inp ? inp.value : true) : null);
                };
                closeModal = () => done(0);
                if (inp) {
                    setTimeout(() => {
                        inp.focus();
                        const dot = inp.value.lastIndexOf('.');
                        inp.setSelectionRange(0, dot > 0 ? dot : inp.value.length);
                    }, 30);
                    inp.onkeydown = e => {
                        if (e.key == 'Enter')
                            done(1);
                    };
                }
                m.onclick = e => {
                    const b = e.target.closest('[data-r]');
                    if (b)
                        done(+b.dataset.r);
                    else if (e.target === m)
                        done(0);
                };
            });
        }
        const dl = rows => `<dl class="prop">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;

        /* ===== タブ ===== */
        function renderTabs() {
            const el = $('tabs');
            if (isHome()) {
                el.innerHTML = `<div class="brand">${appIc()}<span>たるファイラー</span></div>`;
                return;
            }
            el.innerHTML = S.tabs.map((t, i) => {
                const st = stOf(t.st);
                const name = tabName(t);
                const close = i == S.cur ? `<span class="tx" data-x="1" aria-label="タブを閉じる">${sv('close')}</span>` : '';
                return `<div class="tab${i == S.cur ? ' on' : ''}" data-i="${i}"><span class="ti">${ico(st)}</span><span class="tl">${esc(name)}</span>${close}</div>`;
            }).join('');
            const on = el.querySelector('.tab.on');
            if (on)
                el.scrollLeft = Math.max(0, Math.min(el.scrollLeft, on.offsetLeft - 4), on.offsetLeft + on.offsetWidth - el.clientWidth + 4);

        function switchTab(i) {
            if (i == S.cur)
                return;
            S.cur = i;
            leaveFolder();
            save();
            renderAll();
        }
        /* タブを増やす(元のタブの名前などを引き継ぎます) */
        function addTab(t, at = S.tabs.length) {
            /* 表示の仕方: 「このタブを複製」は元のタブから引き継ぎます。
               ドロワー・ホームから開く新しいタブは、最後に使った「一覧表示」か「アイコン表示」(S.view)で開きます */
            const view = t.view || (S.view == 'grid' ? 'grid' : 'list');
            S.tabs.splice(at, 0, { st: t.st, p: [...t.p], fav: t.fav, from: t.from, name: t.name, view });
            if (at <= S.cur)
                S.cur++;
            switchTab(at);
        }
        /* ドロワーから開く: 同じお気に入り(ストレージ)のタブがあればそこへ切り替え、なければ新しいタブで開きます。
           here=true のときは今のタブで開きます(タブの名前も変わります) */
        function openSrc(src, here) {
            if (here && !isHome()) {
                const t = tab();
                t.fav = src.fav;
                t.from = src.from;
                t.name = src.name;
                go(src.st, src.p);
                return;
            }
            const i = S.tabs.findIndex(t => src.fav ? t.fav == src.fav : t.from == src.from);
            if (i < 0) {
                addTab(src);
                return;
            }
            /* 同じお気に入り(ストレージ)のタブがあるときは、そのタブで登録した場所(ストレージは一番上)を開き直します。
               すでにその場所にいるときは、タブを切り替えるだけ(スクロールの位置もそのまま) */
            const t = S.tabs[i];
            if (t.st == src.st && samePath(t.p, src.p)) {
                switchTab(i);
                return;
            }
            S.cur = i;
            go(src.st, src.p);
        }
        const favSrc = f => ({ st: f.st, p: f.p, fav: f.id, from: undefined, name: f.name });
        const stSrc = st => ({ st: st.id, p: [], fav: undefined, from: 'st:' + st.id, name: st.name });
        function closeTab(i) {
            S.tabs.splice(i, 1);
            if (i < S.cur || S.cur >= S.tabs.length)
                S.cur = Math.max(0, S.cur - 1); /* 最後のタブを閉じるとホームになります */
            leaveFolder();
            save();
            renderAll();
        }
        function tabMenu(it, x, y) {
            const i = +it.dataset.i, t = S.tabs[i];
            popMenu(x, y, [
                { t: 'このタブを複製', ic: 'dup', act: () => addTab(t, i + 1) },
                { t: 'このタブを閉じる', ic: 'close', act: () => closeTab(i) },
                { t: 'ほかのタブを閉じる', dis: S.tabs.length < 2, act: () => { S.tabs = [t]; S.cur = 0; leaveFolder(); save(); renderAll(); } },
                { t: 'すべてのタブを閉じる', act: () => { S.tabs = []; S.cur = 0; leaveFolder(); save(); renderAll(); } },

        /* ===== パス表示とお気に入り登録 ===== */
        function renderPath() {
            const b = $('bStar');
            b.hidden = isHome() || isTrash();
            if (isHome()) {
                $('crRoot').innerHTML = `<span class="cr one last">${sv('home')} ホーム</span>`;
                $('crL1').innerHTML = '';

                return;
            }
            const t = tab(), st = stOf(t.st), fav = findFav(t.st, t.p);
            b.innerHTML = sv(fav ? 'starOn' : 'star');
            b.classList.toggle('on', !!fav);
            const n = t.p.length;
            $('crRoot').innerHTML = `<button class="cr${n ? '' : ' last'}" data-d="0"><span class="rti">${ico(st)}</span><span class="rtn">${esc(rootLabel(st))}</span></button>`;
            layoutCrumbs(t.p);
        }
        /* フォルダ部分を1行 or 2行に並べます(どの行も「›」から始まります) */
        function layoutCrumbs(p) {
            const n = p.length, c = $('crumbs'), l1 = $('crL1'), l2 = $('crL2');
            const seg = i => `<span class="cs">›</span><button class="cr${i == n - 1 ? ' last' : ''}" data-d="${i + 1}">${esc(p[i])}</button>`;
            const segs = p.map((_, i) => seg(i));
            c.classList.remove('two');
            l2.hidden = true;
            l2.innerHTML = '';
            l1.innerHTML = segs.join('');
            if (n > 1 && l1.scrollWidth > l1.clientWidth + 1) {
                /* 2行: 下の行に、今いるフォルダから順に入るだけ詰めます(最低1つ) */
                c.classList.add('two');
                l2.hidden = false;
                l2.classList.add('meas'); /* 測るあいだは「…」で縮めない */
                let k = 1;
                l2.innerHTML = segs.slice(n - 1).join('');
                while (k < n) {
                    l2.innerHTML = segs.slice(n - k - 1).join('');
                    if (l2.scrollWidth > l2.clientWidth + 1)
                        break;
                    k++;
                }
                l2.classList.remove('meas');
                if (k >= n)
                    k = n - 1; /* 上の行にも最低1つ残します */
                l2.innerHTML = segs.slice(n - k).join('');
                l1.innerHTML = segs.slice(0, n - k).join('');
            }
            l1.scrollLeft = l1.scrollWidth;
            fadeCrumbs();
        }
        const fadeCrumbs = () => $('crL1').classList.toggle('fadeL', $('crL1').scrollLeft > 2);
        function toggleStar() {
            const t = tab(), f = findFav(t.st, t.p);
            if (f) {
                S.favs = S.favs.filter(x => x !== f);
                toast('お気に入りから外しました');
            }
            else {
                addFav(t.st, t.p);
                toast('お気に入りに登録しました');
            }
            save();
            renderPath();
            renderDrawer();
        }
        function addFav(stId, p) {
            if (findFav(stId, p))
                return;
            S.favs.push({ id: uid(), name: p.length ? p[p.length - 1] : stOf(stId).name, st: stId, p: [...p] });
        }
        async function showFullPath() {
            if (isHome())
                return;
